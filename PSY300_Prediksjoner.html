<!DOCTYPE html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSY300 · Spørsmål i forelesningen</title>
<style>
:root{--navy:#1F3864;--blue:#2E5496;--light:#DCE6F1;--green:#2E7D32;--red:#C0392B;--orange:#B26A00;--bg:#F4F6FB;--card:#fff;--line:#d9dee8;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1a2233;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:20.5px;margin:0;font-weight:700}
header p{margin:2px 0 0;font-size:15.5px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h2{color:var(--navy);margin:.1em 0 .5em;font-size:21px;line-height:1.35}
.kick{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);font-weight:700}
.muted{color:#62708a;font-size:16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:11px;
     padding:14px 16px;margin:9px 0;font-size:18px;font-family:inherit;cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f7f9ff}
.opt:disabled{cursor:default}
.opt .ltr{display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;
     background:var(--light);color:var(--navy);font-weight:700;margin-right:12px;flex:none}
.opt.valgt{border-color:var(--blue);background:#eef3fb}
.opt.valgt .ltr{background:var(--blue);color:#fff}
.opt.riktig{border-color:var(--green);background:#eaf6ea}
.opt.riktig .ltr{background:var(--green);color:#fff}
.opt.galt{border-color:var(--red);background:#fbeceb}
.kvittering{background:#eaf6ea;border:1px solid #bcdcbc;border-left:5px solid var(--green);border-radius:10px;
     padding:13px 15px;margin:14px 0;font-size:17px;color:#1d4620}
.btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 18px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;margin:3px}
.btn:hover{background:var(--navy)}
.btn2{background:#eef1f7;color:var(--navy);border:0;border-radius:9px;padding:10px 18px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;margin:3px}
.laererpanel{background:#fff8ec;border:1px solid #f0dcb8;border-left:5px solid var(--orange);border-radius:10px;padding:14px 16px;margin:14px 0}
.laererpanel .lbl{display:block;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:6px}
canvas{width:100%;display:block;margin:8px 0}
.expl{background:#eef3fb;border:1px solid #c7d6ec;border-left:5px solid var(--navy);border-radius:10px;padding:13px 15px;margin:12px 0;font-size:17px}
.liste a{display:block;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin:7px 0;
     text-decoration:none;color:#1a2233;background:#fff;font-size:16.5px}
.liste a:hover{border-color:var(--blue);background:#f7f9ff}
.liste b{color:var(--navy)}
.flab{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700;margin:18px 0 4px}
.hide{display:none !important}
.simlenke{font-size:15.5px;color:var(--blue)}
.merke{display:inline-block;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:2px}
.m-pred{background:#fff2e0;color:var(--orange)}
.m-apn{background:#e7f1ff;color:var(--blue)}
.m-sjekk{background:#eaf6ea;color:var(--green)}
.m-avsl{background:#efe7fb;color:#5b3a9e}
.m-test{background:#e6f4f7;color:#166b7d}
.m-res{background:#eef1f7;color:#5a6b7b}
#nav{display:flex;align-items:center;gap:10px}
#nav .muted{flex:1;text-align:center}
body.pres .wrap{max-width:1100px}
body.pres h2{font-size:27px}
body.pres .opt{font-size:22px;padding:17px 19px}
body.pres .kvittering,body.pres .expl{font-size:20px}
</style></head><body>

<header>

</div>

const BACKEND = "https://script.google.com/macros/s/AKfycby4YnQ2gN4UmA05xK7n1rC0ex_UVpNAjJPYNmRqvGfgUGuXp0EclxmyFUeKeVktMfg5YQ/exec";
const BASE_SIM = "https://torgeirmoberget.github.io/psy300-sim/";
const ITEMS = [{"id": "F1-1","f": 1,"dekk": 1,"slide": null,"type": "forelesning","rolle": "Åpner","sim": null,"app": null,"ch": 2,"fasit": "B","q": "I terapistudien beregner vi gjennomsnittlig depresjonsskår for de 75 deltakerne. Tallet vi får er:","A": "En parameter","B": "Et estimat","C": "En standardfeil","D": "En operasjonalisering","expl": "Parameteren er den ukjente verdien i populasjonen; tallet vi beregner i utvalget er vårt estimat av den."},{"id": "PRED-F1-03","f": 1,"dekk": 1,"slide": 81,"type": "pred","rolle": "Prediksjon","sim": 1,"app": "PSY300_Sim_Datatypelaben.html","ch": null,"fasit": "D","q": "Prøveskårene 0–5 fra lett OG vanskelig betingelse samlet danner en topuklet (bimodal) fordeling. Hvilket sentralmål beskriver en typisk student best?","A": "Gjennomsnittet","B": "Medianen","C": "Modus","D": "Ingen av dem — gruppene bør beskrives hver for seg","expl": "Ved en bimodal fordeling beskriver ikke noe enkelt sentralmål en typisk person: gjennomsnittet (2,5) lander i dalen mellom toppene og beskriver nesten ingen. Løsningen er ikke et bedre oppsummeringstall, men å splitte på gruppe. SE alltid fordelingen før du oppsummerer den (PSY300_Sim_Datatypelaben.html)."},{"id": "PRED-F1-04","f": 1,"dekk": 1,"slide": 82,"type": "pred","rolle": "Prediksjon","sim": 2,"app": "PSY300_Sim_Robusthetslaben.html","ch": null,"fasit": "A","q": "Et utvalg på 21 depresjonsskårer har gjennomsnitt ≈ 30. Én verdi feiltastes til 80. Hvilket sentralmål flytter seg MEST?","A": "Gjennomsnittet","B": "Medianen","C": "Modus","D": "Alle flytter seg like mye","expl": "Gjennomsnittet bruker VERDIEN til hver observasjon, så én ekstremverdi drar det kraftig. Medianen bruker bare rangordningen (den rikker seg knapt), og modus bare hyppighet (den står stille). Motgiftene i demoen: trimmet og winsorisert gjennomsnitt, og transformasjon av skjeve data (PSY300_Sim_Robusthetslaben.html)."},{"id": "PRED-F1-02","f": 1,"dekk": 1,"slide": 94,"type": "pred","rolle": "Prediksjon","sim": 4,"app": "PSY300_Sim_HvorforNminus1.html","ch": null,"fasit": "B","q": "Vi beregner variansen i mange utvalg ved å dele kvadratsummen rundt utvalgets EGET gjennomsnitt på n. I snitt vil estimatet …","A": "Treffe sann σ² — det er jo bare et gjennomsnitt","B": "Være systematisk for LITE (med faktoren (n − 1)/n)","C": "Være systematisk for stort","D": "Bomme tilfeldig, uten systematikk","expl": "x̄ legger seg per definisjon midt i akkurat ditt utvalg, så avvikene rundt x̄ er mindre enn avvikene rundt sann μ — i snitt nøyaktig faktoren (n − 1)/n. Derfor deler vi på n − 1."},{"id": "PRED-F1-01","f": 1,"dekk": 1,"slide": 95,"type": "pred","rolle": "Prediksjon","sim": 5,"app": "PSY300_Sim_MinsteKvadrater.html","ch": null,"fasit": "B","q": "Vi prøver ulike kandidatverdier som «modell» for et datasett og summerer de kvadrerte avvikene. Hvor bunner feilkurven?","A": "Ved medianen","B": "Ved gjennomsnittet","C": "Midt mellom minste og største verdi","D": "Vet ikke","expl": "Total kvadrert feil bunner nøyaktig ved gjennomsnittet — gjennomsnittet er minste-kvadraters-modellen."},{"id": "PRED-F2-01","f": 2,"dekk": 1,"slide": 103,"type": "pred","rolle": "Prediksjon","sim": 3,"app": "PSY300_Sim_Utvalgsfordeling.html","ch": null,"fasit": "B","q": "Populasjonen av depresjonsskårer er tydelig skjev. Vi trekker 1 000 utvalg (n = 75) og tegner fordelingen av gjennomsnittene. Hvordan ser den ut?","A": "Like skjev som populasjonen","B": "Tilnærmet normalfordelt","C": "Uniform (flat)","D": "Vet ikke","expl": "Sentralgrenseteoremet: utvalgsfordelingen til gjennomsnittet nærmer seg normalfordeling uansett populasjonens form."},{"id": "PRED-F1-05","f": 1,"dekk": 1,"slide": 104,"type": "pred","rolle": "Prediksjon","sim": 3,"app": "PSY300_Sim_Utvalgsfordeling.html","ch": null,"fasit": "C","q": "Vi trekker mange utvalg på n = 25 fra den samme populasjonen og regner ut gjennomsnittet i hvert. Så firedobler vi utvalgsstørrelsen til n = 100. Hva skjer med spredningen i disse gjennomsnittene?","A": "Den halveres ikke, men blir en firedel, siden n ble firedoblet","B": "Den er uendret, fordi populasjonen er den samme","C": "Den halveres, fordi standardfeilen går som σ/√n","D": "Den øker, fordi større utvalg fanger flere ekstreme verdier","expl": "SE = σ/√n. Firedobler du n, ganges √n med 2, så standardfeilen halveres. Presisjon kjøpes med kvadratroten av deltakere, ikke med n selv. Spredningen i populasjonen endrer seg ikke, det er spredningen i gjennomsnittene som krymper."},{"id": "PRED-F1-06","f": 1,"dekk": 1,"slide": 109,"type": "pred","rolle": "Prediksjon","sim": 6,"app": "PSY300_Sim_Konfidensintervaller.html","ch": null,"fasit": "B","q": "Vi lager 100 konfidensintervaller på 95 %, ett fra hvert av 100 utvalg fra den samme populasjonen. Omtrent hvor mange av dem inneholder populasjonsgjennomsnittet μ?","A": "Alle 100, det er derfor de kalles konfidensintervaller","B": "Omtrent 95, og hvilke som bommer, vet vi aldri i praksis","C": "Omtrent 95, og de som bommer, kan kjennes igjen på at de er brede","D": "Det avhenger av utvalgsstørrelsen: med stor n treffer alle","expl": "95 % er en egenskap ved prosedyren over gjentatte utvalg, ikke ved det ene intervallet du har. Omtrent 5 av 100 bommer, og bredden røper ikke hvilke: et smalt intervall kan bomme, og et bredt kan treffe."},{"id": "F1-2","f": 1,"dekk": 1,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 2,"fasit": "B","q": "Standardfeilen til gjennomsnittet beskriver:","A": "Hvor mye enkeltpersoner varierer rundt gjennomsnittet","B": "Hvor mye utvalgsgjennomsnittet ville variert fra utvalg til utvalg","C": "Hvor stor målefeilen i spørreskjemaet er","D": "Avstanden mellom gjennomsnittet og medianen","expl": "Standardfeil er standardavviket til utvalgsfordelingen — spredningen av tenkte gjentatte utvalgs gjennomsnitt. Ikke forveksle med standardavvik (spredning av personer)."},{"id": "F1-4","f": 1,"dekk": 1,"slide": null,"type": "forelesning","rolle": "Avslutning","sim": null,"app": null,"ch": 1,"fasit": "A","q": "Variabelen Gruppe (ISTDP vs. venteliste) i terapidatasettet er målt på:","A": "Nominalnivå","B": "Ordinalnivå","C": "Intervallnivå","D": "Forholdstallnivå","expl": "To kategorier uten rangordning. At «behandling er mer enn venteliste» er substans, ikke måling."},{"id": "F1-5","f": 1,"dekk": 1,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 2,"fasit": "A","q": "I undervisningsrekkefølgen P-E-S-I-N kommer Estimering før Standardfeil fordi:","A": "Vi må ha et estimat før det gir mening å spørre hvor presist det er","B": "Standardfeil kan bare beregnes for normalfordelte variabler","C": "Estimering er enklere matematikk","D": "Parametere må være kjent før standardfeilen kan finnes","expl": "Rekkefølgen er logisk: hvert trinn stiller neste spørsmål om det forrige. Parameteren er alltid ukjent — det er derfor vi estimerer."},{"id": "F1-6","f": 1,"dekk": 1,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 1,"fasit": "B","q": "Hva er den viktigste designforskjellen mellom terapidatasettet og arbeidskravsdatasettet?","A": "Terapistudien randomiserte, arbeidskravsstudien gjorde ikke det","B": "Begge randomiserte, men terapistudien fulgte deltakerne over tre tidspunkter","C": "Terapistudien er et eksperiment, arbeidskravsstudien et rent tverrsnitt","D": "Arbeidskravsstudien manglet kontrollgruppe","expl": "Begge er randomiserte eksperimenter (ISTDP vs. venteliste; lett vs. vanskelig prøve) — forskjellen er tidsdimensjonen (tre vs. to tidspunkter)."},{"id": "F2-1","f": 2,"dekk": 2,"slide": null,"type": "forelesning","rolle": "Åpner","sim": null,"app": null,"ch": 2,"fasit": "B","q": "En t-test gir p = ,03. Hva betyr det?","A": "3 % sannsynlighet for at nullhypotesen er sann","B": "Sannsynligheten for et resultat minst like ekstremt som vårt, gitt at nullhypotesen er sann, er 3 %","C": "97 % sannsynlighet for at funnet replikeres","D": "Effekten er liten, men reell","expl": "p er P(data | H0), ikke P(H0 | data) — den vanligste misforståelsen i hele faget."},{"id": "PRED-F2-04","f": 2,"dekk": 2,"slide": 13,"type": "pred","rolle": "Prediksjon","sim": 10,"app": "PSY300_Sim_Phackinghagen.html","ch": null,"fasit": "C","q": "I data der ALLE nullhypoteser er sanne prøver du 20 ulike analyser (andre utfall, undergrupper, kovariater …). Sjansen for minst ett «signifikant» funn er omtrent:","A": "5 %","B": "20 %","C": "64 %","D": "95 %","expl": "1 − 0,95²⁰ ≈ 64 %. Forskerens frihetsgrader er familievis feil i naturlig habitat — derfor skilles planlagte og utforskende analyser."},{"id": "PRED-F2-03","f": 2,"dekk": 2,"slide": 14,"type": "pred","rolle": "Prediksjon","sim": 9,"app": "PSY300_Sim_Biasfabrikken.html","ch": null,"fasit": "B","q": "100 laboratorier studerer en effekt som i sannhet er NULL (n = 40 per gruppe). Bare studier med p < ,05 publiseres. Hva er gjennomsnittlig effektstørrelse i de publiserte studiene?","A": "Omtrent 0 — effekten er jo null","B": "Klart større enn 0 (typisk d ≈ 0,5)","C": "Umulig å si noe om","D": "Negativ, siden de fleste studier feiler","expl": "Bare de tilfeldig største utslagene passerer p < ,05-filteret — de publiserte studiene er en selektert hale. Med d = 0 og n = 40 ligger publiserte effekter typisk rundt |d| ≈ 0,5."},{"id": "F2-3","f": 2,"dekk": 2,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 3,"fasit": "B","q": "Med n = 10 000 finner en studie r = ,03, p < ,001. Beste tolkning?","A": "En sterk sammenheng, siden p er svært lav","B": "En triviell sammenheng, svært presist målt","C": "Resultatet må skyldes en regnefeil","D": "Sammenhengen er sterk, men bare i store utvalg","expl": "p kombinerer effekt og n; med enorme utvalg blir trivielle effekter «signifikante». r = ,03 er under 0,1 % delt varians."},{"id": "F2-4","f": 2,"dekk": 2,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 16,"fasit": "C","q": "Terapidatasettet har 44 kvinner og 31 menn; vi tester mot 50/50. Forventet antall kvinner under H0?","A": "44","B": "50","C": "37,5","D": "31","expl": "Forventet = N × 0,5 = 75/2 = 37,5. Kjikvadrat sammenligner observert med forventet — og «forventet» kommer alltid fra H0."},{"id": "F2-5","f": 2,"dekk": 2,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 1,"fasit": "A","q": "Depresjonsskårene ved baseline er venstreskjeve (lang hale mot lave verdier). Hva gjelder da typisk?","A": "Gjennomsnittet er lavere enn medianen","B": "Gjennomsnittet er høyere enn medianen","C": "Gjennomsnitt og median er like","D": "Medianen kan ikke beregnes for skjeve fordelinger","expl": "Halen drar gjennomsnittet med seg — mot venstre her."},{"id": "F2-6","f": 2,"dekk": 2,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 2,"fasit": "B","q": "Α = ,05 er risikoen for å:","A": "Beholde en falsk nullhypotese","B": "Forkaste en sann nullhypotese","C": "Trekke et skjevt utvalg","D": "Få en effektstørrelse under 0,5","expl": "Type I-feil. Å beholde en falsk H0 er type II (β). α er en villet, tallfestet feilrate."},{"id": "F3-1","f": 3,"dekk": 3,"slide": null,"type": "forelesning","rolle": "Åpner","sim": null,"app": null,"ch": 7,"fasit": "B","q": "Hvilken korrelasjon er sterkest?","A": "r = +,40","B": "r = −,80","C": "r = +,08","D": "r = ,00","expl": "Styrke = absoluttverdi; fortegnet angir bare retning."},{"id": "PRED-F3-02","f": 3,"dekk": 3,"slide": 6,"type": "pred","rolle": "Prediksjon","sim": 8,"app": "PSY300_Sim_Utliggerlaben.html","ch": null,"fasit": "C","q": "Ett enkelt datapunkt flyttes til en ekstrem posisjon YTTERST i x-området, langt fra linjen. Hva skjer med regresjonslinjen?","A": "Nesten ingenting — det er jo bare ett punkt av 31","B": "Linjen flytter seg litt parallelt","C": "Linjen kan dras kraftig — punktet kan til og med snu retningen","D": "Bare r påvirkes, ikke linjen","expl": "Minste kvadraters metode kvadrerer avvikene, og punkter ytterst i x-området har høy leverage — ett punkt kan snu hele linjen. Se alltid spredningsplottet."},{"id": "PRED-F3-03","f": 3,"dekk": 3,"slide": 7,"type": "pred","rolle": "Prediksjon","sim": 12,"app": "PSY300_Sim_Attenuering.html","ch": null,"fasit": "B","q": "Den sanne korrelasjonen mellom to konstrukter er ρ = ,60. Begge målene har reliabilitet ,70. Hva venter du å observere?","A": "r ≈ ,60 — reliabilitet påvirker ikke korrelasjoner","B": "r ≈ ,42","C": "r ≈ ,30","D": "r ≈ ,70","expl": "Observert r = ρ·√(rel·rel) = ,60 × ,70 = ,42. Målefeil attenuerer (svekker) alle sammenhenger — og interaksjonsledd rammes hardest."},{"id": "PRED-F4-02","f": 4,"dekk": 3,"slide": 10,"type": "pred","rolle": "Prediksjon","sim": 13,"app": "PSY300_Sim_SimpsonsParadoks.html","ch": null,"fasit": "B","q": "Innad i HVERT av tre fagfelt er sammenhengen mellom studietimer og karakter negativ. Kan den samlede sammenhengen (alle studenter under ett) være positiv?","A": "Nei — helheten må gå samme vei som delene","B": "Ja — hvis gruppene skiller seg systematisk i både x og y","C": "Bare hvis utvalget er lite","D": "Bare ved målefeil","expl": "Simpsons paradoks: gruppetilhørighet (en tredjevariabel) kan snu fortegnet. Kontrollér for gruppe i regresjonen, så gjenstår innen-gruppe-historien."},{"id": "PRED-F4-03","f": 4,"dekk": 3,"slide": 13,"type": "pred","rolle": "Prediksjon","sim": 14,"app": "PSY300_Sim_Residualantakelser.html","ch": null,"fasit": "B","q": "Residualplottet viser en tydelig trakt (spredningen øker med x), og få deltakere har høye x-verdier. Under H0 vil testen av stigningstallet …","A": "Gi et skjevt estimat av b","B": "Beholde b forventningsriktig, men gjøre SE-ene, p-verdiene og KI-ene upålitelige (mange falske positiver)","C": "Være upåvirket — regresjon er robust","D": "Snu fortegnet på r","expl": "Heteroskedastisitet gjør ikke b skjevt, men én felles standardfeil er feil for alle — og når punktene med mest innflytelse også har mest støy, kan testen gi ~20–25 % falske positiver. Sjekk residualplottet!"},{"id": "F3-3","f": 3,"dekk": 3,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 7,"fasit": "C","q": "Depresjon og undertrykkende forsvar korrelerer ,48 ved baseline. Hva kan vi konkludere?","A": "Forsvar forårsaker depresjon","B": "Depresjon forårsaker forsvar","C": "De henger sammen; retning og årsak kan ikke avgjøres av korrelasjonen alene","D": "Sammenhengen er spuriøs","expl": "Korrelasjon gir verken retning eller årsak; tredjevariabler kan drive begge. Merk at «spuriøs» også er en overkonklusjon — det må påvises."},{"id": "F3-4","f": 3,"dekk": 3,"slide": null,"type": "forelesning","rolle": "Avslutning","sim": null,"app": null,"ch": 7,"fasit": "B","q": "R = ,48 mellom depresjon og undertrykkende forsvar betyr at:","A": "48 % av variasjonen i depresjon deles med forsvar","B": "Cirka 23 % av variasjonen deles","C": "Depresjon øker med 0,48 enheter per enhet forsvar","D": "48 % av deltakerne viser mønsteret","expl": "Delt varians = r² = ,48² ≈ ,23. Alternativ C beskriver et stigningstall — broen til regresjon."},{"id": "F3-5","f": 3,"dekk": 3,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 7,"fasit": "B","q": "Vi beregner korrelasjonen KUN blant de mest deprimerte (øverste kvartil). Hva skjer typisk med |r|?","A": "Den øker — gruppen er mer homogen","B": "Den minker","C": "Uendret — sammenhengen er jo den samme","D": "Den skifter fortegn","expl": "Restriksjon av variasjonsbredde svekker korrelasjoner; r er ikke en egenskap ved «sammenhengen» uavhengig av utvalget."},{"id": "F3-6","f": 3,"dekk": 3,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 6,"fasit": "C","q": "Én deltaker har ekstremverdier på begge variablene. Beste FØRSTE respons:","A": "Slette deltakeren","B": "Rapportere korrelasjonen som den er","C": "Inspisere spredningsplottet og kjøre analysen med og uten","D": "Bytte til et større utvalg","expl": "Utliggere kan både skape og skjule korrelasjoner; sensitivitetsanalyse før beslutning. Fjerning er en substansiell, dokumenterbar avgjørelse."},{"id": "F4-1","f": 4,"dekk": 4,"slide": null,"type": "forelesning","rolle": "Åpner","sim": null,"app": null,"ch": 8,"fasit": "B","q": "Modellen er Depresjon_3mnd = 4,3 + 0,63 · Depresjon_pre. Hva betyr 0,63?","A": "Korrelasjonen mellom de to målingene","B": "Én enhet høyere pre-skår gir 0,63 enheter høyere predikert oppfølgingsskår","C": "Modellen forklarer 63 % av variasjonen","D": "Gjennomsnittlig oppfølgingsskår er 0,63","expl": "b, r og R² er i slekt med én prediktor, men bare b har måleenhet."},{"id": "PRED-F5-02","f": 5,"dekk": 4,"slide": 11,"type": "pred","rolle": "Prediksjon","sim": 19,"app": "PSY300_Sim_Antakelsesbryteren.html","ch": null,"fasit": "A","q": "To grupper, ingen sann effekt. Den MINSTE gruppen (n = 15) har størst spredning (SD-forhold 3:1 mot n = 60). Student-t med α = ,05: den faktiske type I-raten blir …","A": "Klart over 5 % (liberal test)","B": "Omtrent 5 % — testen er robust","C": "Klart under 5 % (konservativ test)","D": "Nøyaktig 5 % per definisjon","expl": "Student-t bruker samlet varians, som undervurderer støyen når den lille gruppen er den mest variable → for mange falske positiver. Welch-t reparerer det. Bytt om n-ene, og testen blir konservativ i stedet."},{"id": "F4-2","f": 4,"dekk": 4,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 8,"fasit": "B","q": "Regresjonslinjen legges slik at:","A": "Den går gjennom flest mulig datapunkter","B": "Summen av kvadrerte avstander fra punktene til linjen er minst mulig","C": "Like mange punkter ligger over som under","D": "Den går gjennom gjennomsnittet av x og maksimum av y","expl": "«Best fit» betyr minimert samlet kvadrert feil — linjen treffer sjelden noen punkter eksakt (jf. Sim 5)."},{"id": "F4-4","f": 4,"dekk": 4,"slide": null,"type": "forelesning","rolle": "Avslutning","sim": null,"app": null,"ch": 8,"fasit": "B","q": "Residualet for en deltaker er:","A": "Avstanden fra deltakerens skår til gjennomsnittet","B": "Differansen mellom observert og predikert verdi","C": "Deltakerens standardfeil","D": "Målefeilen i instrumentet","expl": "Residual = det modellen ikke fanger. Avvik fra gjennomsnittet er residualet i den «tomme» modellen uten prediktorer."},{"id": "F4-5","f": 4,"dekk": 4,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 8,"fasit": "A","q": "I modellen Selvtillit_post ~ Selvtillit_pre + Betingelse er b for Betingelse −0,76. Riktig tolkning:","A": "Vanskelig-gruppen ligger 0,76 lavere i predikert post-selvtillit enn lett-gruppen, ved samme før-skår","B": "Selvtilliten faller 0,76 fra pre til post","C": "Betingelse korrelerer −,76 med selvtillit","D": "76 % av effekten skyldes betingelsen","expl": "«Holdt konstant»-tolkningen er gevinsten ved multippel regresjon; koeffisienten er ikke en endringsskår."},{"id": "F4-6","f": 4,"dekk": 4,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 8,"fasit": "B","q": "Modellen er estimert på prøveskårer 0–5. En kollega predikerer selvtillit for skåre 8. Problemet er:","A": "Ingenting — modellen er lineær, så den gjelder overalt","B": "Prediksjon utenfor observert område er uten empirisk støtte","C": "Regresjon kan bare predikere gjennomsnittet","D": "Man må først standardisere variablene","expl": "Linearitet er antatt innenfor dataområdet; utenfor er det ren antakelse (ekstrapolering)."},{"id": "F5-1","f": 5,"dekk": 5,"slide": null,"type": "forelesning","rolle": "Åpner","sim": null,"app": null,"ch": 9,"fasit": "B","q": "Vi sammenligner depresjon ved oppfølging mellom ISTDP- og ventelistegruppen. Riktig test:","A": "Paret t-test","B": "Uavhengig t-test","C": "En-utvalgs t-test","D": "Korrelasjon","expl": "To ulike grupper personer. Paret krever at samme (eller matchede) personer leverer begge skårene."},{"id": "F5-2","f": 5,"dekk": 5,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 9,"fasit": "B","q": "I t = (M1 − M2) / SE_diff er nevneren:","A": "Standardavviket til skårene i det største utvalget","B": "Standardfeilen til differansen mellom gjennomsnittene","C": "Den samlede variansen i begge gruppene","D": "Effektstørrelsen","expl": "t er signal delt på støy: observert forskjell mot forskjellen vi uansett ville sett mellom tilfeldige utvalg."},{"id": "F5-4","f": 5,"dekk": 5,"slide": null,"type": "forelesning","rolle": "Avslutning","sim": null,"app": null,"ch": 3,"fasit": "B","q": "Cohens d skiller seg fra p ved at d:","A": "Alltid er mindre enn p","B": "Ikke påvirkes systematisk av utvalgsstørrelsen","C": "Bare kan beregnes i eksperimenter","D": "Forteller om funnet er signifikant","expl": "d = forskjell i standardavviksenheter; p krymper med økende n selv når d er konstant."},{"id": "F5-5","f": 5,"dekk": 5,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 9,"fasit": "B","q": "Hovedgevinsten ved paret t-test fremfor uavhengig, når designet tillater det:","A": "Den krever færre antakelser","B": "Stabile forskjeller mellom personer fjernes fra støyleddet","C": "Den gir alltid lavere p","D": "Den unngår regresjon mot gjennomsnittet","expl": "Hver person er sin egen kontroll; gevinsten forutsetter at pre og post korrelerer betydelig — «alltid» er feil."},{"id": "F5-6","f": 5,"dekk": 5,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 9,"fasit": "C","q": "Uavhengig t-test med n1 = 38 og n2 = 37 har df =","A": "75","B": "74","C": "73","D": "37","expl": "(n1 − 1) + (n2 − 1) = N − 2: ett gjennomsnitt estimert per gruppe."},{"id": "F6-1","f": 6,"dekk": 6,"slide": null,"type": "forelesning","rolle": "Åpner","sim": null,"app": null,"ch": 11,"fasit": "B","q": "Med tre grupper kunne vi kjørt tre parvise t-tester. Hovedproblemet:","A": "t-tester virker ikke med tre grupper","B": "Familievis feilrate stiger med antall tester","C": "Gruppene får ulik n","D": "Vi mister frihetsgrader","expl": "Tre tester à α = ,05 gir ~14 % sjanse for minst én falsk positiv (jf. Sim 21). Det er inferensielt uforsvarlig, ikke teknisk umulig."},{"id": "F6-2","f": 6,"dekk": 6,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 11,"fasit": "B","q": "F i enveis-ANOVA er forholdet mellom:","A": "Største og minste gruppegjennomsnitt","B": "Variasjon mellom gruppegjennomsnittene og variasjon innad i gruppene","C": "Forklart varians og total varians","D": "Utvalgsstørrelse og antall grupper","expl": "Samme signal/støy-logikk som t (t² = F med to grupper). «Forklart/total» beskriver η², ikke F."},{"id": "F6-4","f": 6,"dekk": 6,"slide": null,"type": "forelesning","rolle": "Avslutning","sim": null,"app": null,"ch": 11,"fasit": "B","q": "Hensikten med Bonferroni-korreksjon etter en signifikant F:","A": "Øke styrken i de parvise testene","B": "Holde samlet type I-risiko på α på tvers av de parvise testene","C": "Justere for ulik gruppestørrelse","D": "Teste om variansene er like","expl": "α deles på antall sammenligninger; korreksjonen koster styrke — prisen for kontrollert feilrate."},{"id": "F6-5","f": 6,"dekk": 6,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 3,"fasit": "A","q": "Η² = ,30 i enveis-ANOVA-en betyr:","A": "30 % av variasjonen i utfallet ligger mellom gruppene","B": "Gruppene skiller seg med 0,30 standardavvik","C": "30 % sjanse for at H0 er falsk","D": "F-verdien er 0,30","expl": "η² = SS_mellom/SS_total — ANOVA-ens R². Ikke forveksle med d (standardavviksenheter)."},{"id": "F6-6","f": 6,"dekk": 6,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 11,"fasit": "B","q": "Enveis-ANOVA med 3 grupper og N = 75 har df =","A": "F(3, 75)","B": "F(2, 72)","C": "F(2, 74)","D": "F(3, 72)","expl": "df_mellom = k − 1 = 2; df_innen = N − k = 72."},{"id": "F7-1","f": 7,"dekk": 7,"slide": null,"type": "forelesning","rolle": "Åpner","sim": null,"app": null,"ch": 13,"fasit": "B","q": "En Gruppe × Kjønn-interaksjon betyr at:","A": "Både gruppe og kjønn påvirker utfallet","B": "Effekten av gruppe er forskjellig for kvinner og menn","C": "Gruppe og kjønn korrelerer","D": "Kjønnseffekten er størst","expl": "Interaksjon = betinget effekt. «Begge har effekt» er to hovedeffekter — ikke en interaksjon."},{"id": "F7-3","f": 7,"dekk": 7,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 13,"fasit": "B","q": "I et 2 × 2-design bedres kvinner mye av behandling og menn ikke i det hele tatt. Hovedeffekten av behandling er «signifikant, moderat». Faren ved å rapportere bare den?","A": "Ingen — hovedeffekten oppsummerer korrekt","B": "Den gjennomsnittlige effekten beskriver ingen av kjønnene godt","C": "Hovedeffekter kan ikke tolkes i faktorielle design","D": "Kjønn blir en konfunderende variabel","expl": "Ved kvalifiserende interaksjon er «gjennomsnittseffekten» en fiksjon — undersøk enkle effekter. Men hovedeffekter ER tolkbare når interaksjonen er liten."},{"id": "F7-4","f": 7,"dekk": 7,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 16,"fasit": "C","q": "Kjikvadrat-uavhengighetstesten (f.eks. Medisinbruk × Gruppe) ligner mest på hvilken del av en faktoriell ANOVA?","A": "Hovedeffekten av første faktor","B": "Hovedeffekten av andre faktor","C": "Interaksjonsleddet","D": "Feilleddet","expl": "Uavhengighetstesten spør om fordelingen av én kategorisk variabel avhenger av nivået på den andre — strukturelt en interaksjon, med frekvenser i stedet for gjennomsnitt."},{"id": "F7-5","f": 7,"dekk": 7,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 13,"fasit": "B","q": "Et 2 × 3 faktorielt design har:","A": "5 celler","B": "6 celler","C": "2 interaksjoner","D": "3 hovedeffekter","expl": "2 × 3 = 6 kombinasjoner; designet har to hovedeffekter og én interaksjon."},{"id": "F7-6","f": 7,"dekk": 7,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 13,"fasit": "B","q": "I arbeidskravsdataene er Betingelse × Kjønn-interaksjonen F(1, 387) = 4,95, p = ,027, partiell eta² = ,013. Beste karakteristikk:","A": "Stor og viktig effekt","B": "Signifikant, men liten — tolkes med forsiktighet","C": "Ikke-signifikant","D": "Bevis på at kjønn forårsaker sårbarhet","expl": "Signifikans og størrelse er ulike akser; ~1 % forklart varians er lite, og kjønn er målt, ikke manipulert."},{"id": "F8-1","f": 8,"dekk": 8,"slide": null,"type": "forelesning","rolle": "Åpner","sim": null,"app": null,"ch": 14,"fasit": "B","q": "Hovedfordelen med gjentatte målinger fremfor rene mellomgruppedesign:","A": "Flere deltakere","B": "Stabile forskjeller mellom personer fjernes fra feilleddet","C": "Ingen antakelser å sjekke","D": "Tidseffekter blir kausalt tolkbare","expl": "Samme logikk som paret t. Tid er ikke randomisert — en «tidseffekt» kan skyldes alt som følger med tiden."},{"id": "F8-2","f": 8,"dekk": 8,"slide": null,"type": "forelesning","rolle": "Sjekkpunkt","sim": null,"app": null,"ch": 14,"fasit": "B","q": "Mauchlys test er signifikant (sfærisitet brutt). Standard håndtering:","A": "Bytte til uavhengige t-tester","B": "Rapportere Greenhouse–Geisser-korrigerte frihetsgrader","C": "Fjerne det midterste tidspunktet","D": "Ignorere det hvis n > 30","expl": "Greenhouse–Geisser-epsilon krymper df og gjør testen ærlig. Store utvalg reparerer ikke brutte antakelser om kovariansstruktur."},{"id": "F8-4","f": 8,"dekk": 8,"slide": null,"type": "forelesning","rolle": "Avslutning","sim": null,"app": null,"ch": 6,"fasit": "B","q": "Også ventelistegruppen bedres noe fra pre til post. Beste forklaring?","A": "Behandlingen har lekket over","B": "Spontan bedring og regresjon mot gjennomsnittet","C": "Målefeil i instrumentet","D": "Det beviser at terapien er virkningsløs","expl": "Folk søker hjelp på sitt verste; noe bedring kommer av seg selv — derfor trengs kontrollgruppen, og derfor er interaksjonen testen."},{"id": "F8-5","f": 8,"dekk": 8,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 14,"fasit": "B","q": "I den blandede ANOVA-en på depresjon er Tid og Gruppe henholdsvis:","A": "Begge innen-gruppe-faktorer","B": "Innen-gruppe-faktor og mellom-gruppe-faktor","C": "Mellom-gruppe-faktor og innen-gruppe-faktor","D": "Begge mellom-gruppe-faktorer","expl": "Alle måles på alle tidspunkter (innen); hver deltaker er i bare én gruppe (mellom). Sjekk alltid: leverer samme person data på alle nivåer?"},{"id": "F8-6","f": 8,"dekk": 8,"slide": null,"type": "forelesning","rolle": "Reserve","sim": null,"app": null,"ch": 14,"fasit": "B","q": "En uavhengig t-test på endringsskårene (post − pre) mellom gruppene gir t = 3,1. Forholdet til den blandede ANOVA-ens Tid × Gruppe-interaksjon (to tidspunkter)?","A": "De tester forskjellige ting","B": "F_interaksjon = t² ≈ 9,6 — samme test","C": "ANOVA-en er alltid strengere","D": "t-testen krever sfærisitet","expl": "Med to tidspunkter er interaksjonen identisk med endringsskår-testen, og sfærisitet er trivielt oppfylt."},{"id": "F9-1","f": 9,"dekk": 9,"slide": null,"type": "forelesning","rolle": "Testvalg","sim": null,"app": null,"ch": 16,"fasit": "A","q": "I terapistudien (N = 75) vil vi vite om kjønnsfordelingen avviker fra en forventet 50/50-fordeling. Én kategorisk variabel med to nivåer, ingen gruppering. Hvilken analyse er riktig?","A": "Kjikvadrat tilpasningstest","B": "Kjikvadrat uavhengighetstest","C": "Uavhengig t-test","D": "En-utvalgs t-test","expl": "Én kategorisk variabel mot en teoretisk fordeling → tilpasningstest. Uavhengighetstesten krever to kategoriske variabler."},{"id": "F9-2","f": 9,"dekk": 9,"slide": null,"type": "forelesning","rolle": "Testvalg","sim": null,"app": null,"ch": 16,"fasit": "B","q": "Vi vil vite om kjønn henger sammen med medisinbruk (ja/nei). To kategoriske variabler, samme deltakere, ingen gjentatte målinger. Hvilken analyse er /* Rollen huskes i denne nettleseren. Åpne én PSY300-app med ?rolle=underviser
   én gang, så gjelder det alle appene på samme adresse til du åpner med
   ?rolle=student. Ingen innlogging, ingen personopplysninger. */
function PSY300_ROLLE(){
  try{
    const q=new URLSearchParams(location.search).get("rolle");
    if(q==="underviser"||q==="student"){ localStorage.setItem("psy300_rolle",q); }
    return localStorage.getItem("psy300_rolle")||"student";
  }catch(e){ return "student"; }
}
const ROLLE = PSY300_ROLLE();

const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
const BOKSTAVER=["A","B","C","D"];
let AKTIV=null, VALGT=null, RUNDE=1;
const MERKE={Prediksjon:'m-pred', 'Åpner':'m-apn', Sjekkpunkt:'m-sjekk',
             Avslutning:'m-avsl', Testvalg:'m-test', Reserve:'m-res'};
/* Prediksjoner holder tett: simuleringen skal avsløre svaret. Alle andre
   spørsmål tester noe som nettopp er undervist, og der gir retting med en
   gang mest læring. */
const viserFasit = it => it.type !== 'pred';
const kanStemmeIgjen = it => it.rolle === 'Sjekkpunkt';

/* ---------- økt-id, så samme student ikke telles to ganger ---------- */
function sesjon(){
  try{
    let s=localStorage.getItem("psy300_pred_sid");
    if(!s){ s=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
            localStorage.setItem("psy300_pred_sid",s); }
    return s;
  }catch(e){ return "anon-"+Math.random().toString(36).slice(2,8); }
}
const SID=sesjon();
const alleredeSvart=id=>{ try{ return localStorage.getItem("psy300_pred_"+id); }catch(e){ return null; } };
const lagreSvar=(id,b)=>{ try{ localStorage.setItem("psy300_pred_"+id,b); }catch(e){} };

/* ---------- send stemmen ---------- */
function stem(id,bokstav,runde){
  const payload=JSON.stringify({kind:"pred", item_id:id, chosen:bokstav,
                                runde:runde||1, session_id:SID, rolle:ROLLE});
  fetch(BACKEND,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
                 body:payload, keepalive:true}).catch(function(){});
}

/* ---------- visning: ett spørsmål ---------- */
function visSporsmal(it){
  AKTIV=it;
  $("enkelt").classList.remove("hide");
  const bit=[];
  if(it.dekk) bit.push("Forelesning "+it.dekk);
  if(it.sim)  bit.push("Sim "+it.sim);
  bit.push(it.id);
  $("kick").innerHTML=bit.join(" · ")+
    '<span class="merke '+(MERKE[it.rolle]||"m-res")+'">'+it.rolle+"</span>";
  $("sporsmal").textContent=it.q;
  const boks=$("valg"); boks.innerHTML="";
  BOKSTAVER.forEach(function(b){
    const knapp=document.createElement("button");
    knapp.className="opt"; knapp.dataset.b=b;
    knapp.innerHTML='<span class="ltr">'+b+'</span><span>'+it[b]+'</span>';
    knapp.addEventListener("click",function(){ velg(b); });
    boks.appendChild(knapp);
  });
  if(it.app){
    $("simlenke").innerHTML='Simuleringen som gir svaret: <a class="simlenke" href="'+BASE_SIM+it.app+'" target="_blank" rel="noopener">Sim '+it.sim+'</a>';
  }
  const gammelt=alleredeSvart(it.id);
  if(gammelt){ const d=gammelt.split("|"); RUNDE=+(d[1]||1); lasFast(d[0],true); }
  if(ROLLE==="underviser") $("laerer").classList.remove("hide");
  tegnNav();
}

/* ---------- navigasjon innenfor forelesningen ---------- */
function sokenListe(){
  const d=AKTIV.dekk||AKTIV.f;
  return ITEMS.filter(x=>(x.dekk||x.f)===d);
}
function tegnNav(){
  const l=sokenListe(), i=l.findIndex(x=>x.id===AKTIV.id);
  $("navtekst").textContent="Forelesning "+(AKTIV.dekk||AKTIV.f)+" · "+(i+1)+" av "+l.length;
  $("forrige").disabled = i<=0;
  $("neste").disabled   = i>=l.length-1;
}
function bla(steg){
  const l=sokenListe(), i=l.findIndex(x=>x.id===AKTIV.id), n=i+steg;
  if(n<0||n>=l.length) return;
  location.search="?q="+l[n].id;
}

function velg(b){
  if(VALGT) return;
  lagreSvar(AKTIV.id, b+"|"+RUNDE);
  stem(AKTIV.id, b, RUNDE);
  lasFast(b,false);
}

/* peer instruction: stem, snakk sammen, stem igjen. Begge rundene logges. */
function nyRunde(){
  RUNDE=2; VALGT=null;
  $("stemPaaNytt").classList.add("hide");
  $("fasitStudent").classList.add("hide");
  $("kvittering").classList.add("hide");
  document.querySelectorAll(".opt").forEach(o=>{
    o.disabled=false; o.classList.remove("valgt","riktig","galt");
  });
}

function lasFast(b,gjenopptatt){
  VALGT=b;
  document.querySelectorAll(".opt").forEach(function(o){
    o.disabled=true;
    if(o.dataset.b===b) o.classList.add("valgt");
  });
  const k=$("kvittering"); k.classList.remove("hide");
  const runde = RUNDE>1 ? " (runde "+RUNDE+")" : "";
  if(viserFasit(AKTIV)){
    const rett = b===AKTIV.fasit;
    document.querySelectorAll(".opt").forEach(o=>{
      if(o.dataset.b===AKTIV.fasit) o.classList.add("riktig");
      else if(o.dataset.b===b) o.classList.add("galt");
    });
    k.innerHTML = (rett ? "<b>Riktig!</b>" : "<b>Ikke riktig.</b> Fasit er "+AKTIV.fasit+".")+runde;
    const f=$("fasitStudent"); f.classList.remove("hide");
    f.innerHTML='<div class="expl">'+AKTIV.expl+"</div>";
  } else {
    k.innerHTML = (gjenopptatt
      ? "<b>Du har allerede svart "+b+" på denne.</b>"
      : "<b>Svaret ditt er registrert.</b>")+runde+" Fasit avsløres av simuleringen, ikke her.";
  }
  if(kanStemmeIgjen(AKTIV) && RUNDE===1 && !gjenopptatt)
    $("stemPaaNytt").classList.remove("hide");
}

/* ---------- underviser: hent og tegn klassens svar ---------- */
function hentResultat(){
  $("antall").textContent=" henter …";
  fetch(BACKEND+"?action=pred&id="+encodeURIComponent(AKTIV.id))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.ok){ $("antall").textContent=" fant ingen svar ennå"; return; }
      SISTE=d;
      tegn(d.fordeling||{A:0,B:0,C:0,D:0}, d.n||0, d.fordeling2, d.n2||0);
      $("antall").textContent=" "+(d.n||0)+" svar"+((d.n2||0)?" · runde 2: "+d.n2:"");
    })
    .catch(function(){ $("antall").textContent=" kunne ikke hente (sjekk nett)"; });
}

let SISTE=null;
function tegn(f,n,f2,n2){
  const cv=$("graf"); cv.classList.remove("hide");
  const r=window.devicePixelRatio||1, w=cv.clientWidth, h=+(cv.dataset.h||(cv.dataset.h=cv.getAttribute("height")));
  cv.width=w*r; cv.height=h*r; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(r,0,0,r,0,0);
  c.clearRect(0,0,w,h);
  const x0=40,y0=h-34,pw=w-x0-14,ph=y0-24;
  const toRunder = !!(n2 && n2>0);
  const maks=Math.max(1,f.A,f.B,f.C,f.D, toRunder?Math.max(f2.A,f2.B,f2.C,f2.D):0);
  const gap=pw/4, bw=gap*(toRunder?0.30:0.62);
  c.font="bold 15px sans-serif";
  BOKSTAVER.forEach(function(b,i){
    const rett = FASIT_VIST && b===AKTIV.fasit;
    const midt = x0+gap*i+gap/2;
    const v=f[b]||0, bh=v/maks*ph;
    const bx = toRunder ? midt-bw-3 : midt-bw/2;
    c.fillStyle = rett ? "#7fbf88" : "#bcd0e8";
    c.fillRect(bx,y0-bh,bw,bh);
    c.fillStyle="#62708a"; c.textAlign="center";
    c.fillText((n?Math.round(v/n*100):0)+" %", bx+bw/2, y0-bh-7);
    if(toRunder){
      const v2=f2[b]||0, bh2=v2/maks*ph;
      c.fillStyle = rett ? "#2E7D32" : "#4a7fc1";
      c.fillRect(midt+3,y0-bh2,bw,bh2);
      c.fillStyle="#1a2233";
      c.fillText((n2?Math.round(v2/n2*100):0)+" %", midt+3+bw/2, y0-bh2-7);
    }
    c.fillStyle="#1a2233"; c.font="bold 17px sans-serif";
    c.fillText(b,midt,y0+21); c.font="bold 15px sans-serif";
  });
  if(toRunder){
    c.textAlign="left"; c.font="bold 14px sans-serif";
    c.fillStyle="#bcd0e8"; c.fillRect(x0,8,13,13);
    c.fillStyle="#62708a"; c.fillText("runde 1",x0+18,19);
    c.fillStyle="#4a7fc1"; c.fillRect(x0+95,8,13,13);
    c.fillStyle="#1a2233"; c.fillText("etter diskusjon",x0+113,19);
  }
  c.strokeStyle="#b9c3d6"; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(x0-6,y0); c.lineTo(x0+pw,y0); c.stroke();
}

let FASIT_VIST=false;
function visFasit(){
  FASIT_VIST=true;
  document.querySelectorAll(".opt").forEach(function(o){
    if(o.dataset.b===AKTIV.fasit) o.classList.add("riktig");
    else if(o.dataset.b===VALGT) o.classList.add("galt");
  });
  const fb=$("fasitboks"); fb.classList.remove("hide");
  fb.innerHTML='<div class="expl"><b>Fasit '+AKTIV.fasit+':</b> '+AKTIV.expl+'</div>';
  if(!$("graf").classList.contains("hide")) hentResultat();
}

/* ---------- visning: oversikt ---------- */
function visOversikt(){
  $("oversikt").classList.remove("hide");
  /* Rekkefølgen følger slidene i forelesningsdekkene, ikke ID-ene: en
     prediksjon merket F2 kan godt ligge sist i dekket til forelesning 1. */
  const l=$("liste"); let forrige="start", teller=0;
  ITEMS.forEach(function(it){
    const gruppe = it.dekk ? "Forelesning "+it.dekk : "Ikke lagt inn i et dekk ennå";
    if(gruppe!==forrige){
      const h=document.createElement("div"); h.className="flab";
      h.textContent=gruppe; l.appendChild(h); forrige=gruppe; teller=0;
    }
    teller++;
    const a=document.createElement("a");
    a.href="?q="+it.id;
    const hva = it.sim ? "Sim "+it.sim : it.rolle;
    a.innerHTML="<b>"+(it.dekk ? teller+". " : "")+hva+'</b> <span class="merke '+
                (MERKE[it.rolle]||"m-res")+'">'+it.rolle+"</span><br>"+it.q+
                ' <span class="muted">('+it.id+")</span>";
    l.appendChild(a);
  });
}

/* ---------- oppstart ---------- */
(function(){
  const id=(P.get("q")||"").toUpperCase().trim();
  const it=ITEMS.filter(function(x){ return x.id===id; })[0];
  if(it) visSporsmal(it); else visOversikt();
  const kn=$("visResultat"); if(kn) kn.addEventListener("click",hentResultat);
  const kb=$("stemPaaNytt"); if(kb) kb.addEventListener("click",nyRunde);
  const kf1=$("forrige"); if(kf1) kf1.addEventListener("click",()=>bla(-1));
  const kn1=$("neste");   if(kn1) kn1.addEventListener("click",()=>bla(1));
  const kf=$("visFasit");    if(kf) kf.addEventListener("click",visFasit);
  const ko=$("oppdater");    if(ko) ko.addEventListener("click",hentResultat);
  if(P.get("pres")==="1") document.body.classList.add("pres");
  window.addEventListener("resize",function(){
    if(AKTIV && !$("graf").classList.contains("hide")) hentResultat();
  });
})();

/* ---------- bruksstatistikk (anonymt, samme mønster som simuleringsappene) ---------- */
(function(){
  var APP="Prediksjoner", NAVN="Prediksjoner";
  var PSY300_USAGE_URL = BACKEND;
  var sid=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
  var aktiv=0, sist=Date.now(), interaksjoner=0, sendt=false;
  function tikk(){ if(!document.hidden){ var na=Date.now();
    aktiv+=Math.min(30000, na-sist); } sist=Date.now(); }
  document.addEventListener("click",function(){ interaksjoner++; });
  setInterval(tikk, 15000);
  function send(type){
    if(type==="lukket"){ if(sendt) return; sendt=true; tikk(); }
    var payload=JSON.stringify({kind:"usage", app:APP, navn:NAVN, event:type,
      session_id:sid, sekunder:Math.round(aktiv/1000), interaksjoner:interaksjoner,
      innebygd:(window.top!==window.self)?1:0, rolle:PSY300_ROLLE()});
    try{
      if(type==="lukket" && navigator.sendBeacon){
        navigator.sendBeacon(PSY300_USAGE_URL, new Blob([payload],{type:"text/plain;charset=utf-8"}));
      } else {
        fetch(PSY300_USAGE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:payload, keepalive:true}).catch(function(){});
      }
    }catch(e){}
  }
  send("apnet");
  window.addEventListener("pagehide", function(){ send("lukket"); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) send("lukket"); });
})();
</script>
