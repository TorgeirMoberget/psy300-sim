<!DOCTYPE html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSY300 · Spørsmål i forelesningen</title>
<style>
:root{--navy:#1F3864;--blue:#2E5496;--light:#DCE6F1;--green:#2E7D32;--red:#C0392B;--orange:#B26A00;--bg:#F4F6FB;--card:#fff;--line:#d9dee8;}
/* =====================================================================
   PSY300 FARGEKODE — én betydning per farge, den samme i alle appene.
   Poenget er at en student som har sett grønt over rødt i figuren, skal
   kjenne igjen de samme fargene i JASP-tabellen og i den ferdige
   setningen — og dermed se hvor hvert tall kommer fra.
     grønn   variasjon MELLOM grupper · signal · det vi leter etter
     rød     variasjon INNEN grupper · støy · residual
     marine  teststatistikken (F, t, χ²) og frihetsgradene
     lilla   p-verdien
     rav     effektstørrelsen (η², ω², d, R²)
     turkis  konfidensintervallet
   ===================================================================== */
:root{
  --sig:#1E7A3C;    --sig-bg:#E7F4EA;    --sig-kant:#A9D6B6;
  --stoy:#C0392B;   --stoy-bg:#FBEDEB;   --stoy-kant:#EEC3BD;
  --tstat:#1F3864;  --tstat-bg:#E7ECF6;  --tstat-kant:#B9C8E2;
  --pverdi:#7B3FA0; --pverdi-bg:#F3EAF8; --pverdi-kant:#D3BCE4;
  --eff:#B26A00;    --eff-bg:#FDF2E2;    --eff-kant:#EBD0A6;
  --ki:#0F6E7B;     --ki-bg:#E4F1F3;     --ki-kant:#AAD3D9;
}
.k-sig{color:var(--sig);font-weight:600}
.k-stoy{color:var(--stoy);font-weight:600}
.k-tstat{color:var(--tstat);font-weight:700}
.k-p{color:var(--pverdi);font-weight:600}
.k-eff{color:var(--eff);font-weight:600}
.k-ki{color:var(--ki);font-weight:600}
/* markert variant — brukes der et tall skal kunne spores fra tabell til setning */
.m-sig,.m-stoy,.m-tstat,.m-p,.m-eff,.m-ki{border-radius:5px;padding:1px 5px;font-weight:600}
.m-sig{background:var(--sig-bg);color:var(--sig);box-shadow:inset 0 0 0 1px var(--sig-kant)}
.m-stoy{background:var(--stoy-bg);color:var(--stoy);box-shadow:inset 0 0 0 1px var(--stoy-kant)}
.m-tstat{background:var(--tstat-bg);color:var(--tstat);box-shadow:inset 0 0 0 1px var(--tstat-kant)}
.m-p{background:var(--pverdi-bg);color:var(--pverdi);box-shadow:inset 0 0 0 1px var(--pverdi-kant)}
.m-eff{background:var(--eff-bg);color:var(--eff);box-shadow:inset 0 0 0 1px var(--eff-kant)}
.m-ki{background:var(--ki-bg);color:var(--ki);box-shadow:inset 0 0 0 1px var(--ki-kant)}

/* ---- brøkfiguren: teller over streken, nevner under ---- */
.brokfig{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 18px;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 14px;margin:12px 0}
.brokfig .brk{text-align:center;min-width:250px;flex:0 1 auto}
.brokfig .tell,.brokfig .nevn{border-radius:8px;padding:8px 13px;font-size:15.5px;line-height:1.28}
.brokfig .tell{background:var(--sig-bg);color:var(--sig);box-shadow:inset 0 0 0 1px var(--sig-kant)}
.brokfig .nevn{background:var(--stoy-bg);color:var(--stoy);box-shadow:inset 0 0 0 1px var(--stoy-kant)}
.brokfig .strek{height:3px;background:#16203A;border-radius:2px;margin:6px 0}
.brokfig .tall{display:block;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.brokfig .lik{font-size:27px;color:#16203A;font-weight:600}
.brokfig .res{font-size:17px;color:var(--tstat);text-align:center;line-height:1.3}
.brokfig .res b{display:block;font-size:31px;font-weight:700;font-variant-numeric:tabular-nums}
.brokfig .res .n{display:block;font-size:13.5px;color:#5C6A80;font-weight:400;margin-top:3px}
.brokfig.smal .brk{min-width:210px}
.brokfig.smal .tall{font-size:19px}
.brokfig.smal .res b{font-size:25px}

.stat.s-sig{background:var(--sig-bg);color:var(--sig)}
.stat.s-stoy{background:var(--stoy-bg);color:var(--stoy)}
.stat.s-tstat{background:var(--tstat-bg);color:var(--tstat)}
.stat.s-p{background:var(--pverdi-bg);color:var(--pverdi)}
.stat.s-eff{background:var(--eff-bg);color:var(--eff)}
table.anova td.c-sig,table.tt td.c-sig{color:var(--sig);font-weight:700}
table.anova td.c-stoy,table.tt td.c-stoy{color:var(--stoy);font-weight:700}
table.anova td.c-tstat,table.tt td.c-tstat{color:var(--tstat);font-weight:700}
table.anova td.c-p,table.tt td.c-p{color:var(--pverdi);font-weight:700}
table.anova td.c-eff,table.tt td.c-eff{color:var(--eff);font-weight:700}
/* ---- fargeforklaring ---- */
.fargeliste{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px;margin-top:8px}
.fargeliste div{border-radius:8px;padding:7px 11px;font-size:15px;line-height:1.35}
.fargeliste b{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase}

/* ---- ANOVA-tabellen med fargede rader ---- */
table.anova tr.r-sig td,table.tt tr.r-sig td{background:var(--sig-bg)}
table.anova tr.r-stoy td,table.tt tr.r-stoy td{background:var(--stoy-bg)}
table.anova tr.r-sig td:first-child{color:var(--sig);font-weight:700}
table.anova tr.r-stoy td:first-child{color:var(--stoy);font-weight:700}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1a2233;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:20.5px;margin:0;font-weight:700}
header p{margin:2px 0 0;font-size:15.5px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h2{color:var(--navy);margin:.1em 0 .5em;font-size:21px;line-height:1.35}
.kick{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);font-weight:700}
.muted{color:#62708a;font-size:16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:11px;
     padding:14px 16px;margin:9px 0;font-size:18px;font-family:inherit;cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f7f9ff}
.opt:disabled{cursor:default}
.opt .ltr{display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;
     background:var(--light);color:var(--navy);font-weight:700;margin-right:12px;flex:none}
.opt.valgt{border-color:var(--blue);background:#eef3fb}
.opt.valgt .ltr{background:var(--blue);color:#fff}
.opt.riktig{border-color:var(--green);background:#eaf6ea}
.opt.riktig .ltr{background:var(--green);color:#fff}
.opt.galt{border-color:var(--red);background:#fbeceb}
.kvittering{background:#eaf6ea;border:1px solid #bcdcbc;border-left:5px solid var(--green);border-radius:10px;
     padding:13px 15px;margin:14px 0;font-size:17px;color:#1d4620}
.btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 18px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;margin:3px}
.btn:hover{background:var(--navy)}
.btn2{background:#eef1f7;color:var(--navy);border:0;border-radius:9px;padding:10px 18px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;margin:3px}
.laererpanel{background:#fff8ec;border:1px solid #f0dcb8;border-left:5px solid var(--orange);border-radius:10px;padding:14px 16px;margin:14px 0}
.laererpanel .lbl{display:block;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:6px}
canvas{width:100%;display:block;margin:8px 0}
.expl{background:#eef3fb;border:1px solid #c7d6ec;border-left:5px solid var(--navy);border-radius:10px;padding:13px 15px;margin:12px 0;font-size:17px}
.liste a{display:block;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin:7px 0;
     text-decoration:none;color:#1a2233;background:#fff;font-size:16.5px}
.liste a:hover{border-color:var(--blue);background:#f7f9ff}
.liste b{color:var(--navy)}
.flab{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700;margin:18px 0 4px}
.hide{display:none !important}
.simlenke{font-size:15.5px;color:var(--blue)}
.merke{display:inline-block;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:2px}
.m-pred{background:#fff2e0;color:var(--orange)}
.m-apn{background:#e7f1ff;color:var(--blue)}
.m-sjekk{background:#eaf6ea;color:var(--green)}
.m-avsl{background:#efe7fb;color:#5b3a9e}
.m-test{background:#e6f4f7;color:#166b7d}
.m-res{background:#eef1f7;color:#5a6b7b}
#nav{display:flex;align-items:center;gap:10px}
#nav .muted{flex:1;text-align:center}
body.pres .wrap{max-width:1100px}
body.pres h2{font-size:27px}
body.pres .opt{font-size:22px;padding:17px 19px}
body.pres .kvittering,body.pres .expl{font-size:20px}
</style></head><body>

<header>
<h1>PSY300 · Spørsmål i forelesningen</h1>
<p>Skann koden på slida, svar, og se hva salen mener.</p>
</header>

<div class="wrap">

<!-- ===== ett spørsmål ===== -->
<div id="enkelt" class="hide">
  <div class="card">
    <div class="kick" id="kick"></div>
    <h2 id="sporsmal"></h2>
    <div id="valg"></div>
    <div id="kvittering" class="kvittering hide"></div>
    <div id="fasitStudent" class="hide"></div>
    <button class="btn2 hide" id="stemPaaNytt">Stem på nytt etter diskusjon</button>
    <p class="muted" id="simlenke"></p>
    <div id="nav" style="margin-top:10px">
      <button class="btn2" id="forrige">← Forrige</button>
      <span class="muted" id="navtekst"></span>
      <button class="btn2" id="neste">Neste →</button>
    </div>
  </div>

  <div id="laerer" class="laererpanel hide">
    <span class="lbl">Kun for underviser</span>
    <button class="btn" id="visResultat">Vis klassens svar</button>
    <button class="btn2" id="visFasit">Vis fasit</button>
    <button class="btn2" id="oppdater">Hent på nytt</button>
    <span class="muted" id="antall"></span>
    <canvas id="graf" height="230" class="hide"></canvas>
    <div id="fasitboks" class="hide"></div>
  </div>
</div>

<!-- ===== oversikt ===== -->
<div id="oversikt" class="hide">
  <div class="card">
    <h2>Alle spørsmålene i forelesningene</h2>
    <p class="muted">Hvert spørsmål har sin egen QR-kode på slida. Denne siden er oversikten,
    mest til bruk for underviser og for den som vil se gjennom i etterkant.</p>
    <div class="liste" id="liste"></div>
  </div>
</div>

</div>

<script>
"use strict";
const BACKEND = "https://script.google.com/macros/s/AKfycby4YnQ2gN4UmA05xK7n1rC0ex_UVpNAjJPYNmRqvGfgUGuXp0EclxmyFUeKeVktMfg5YQ/exec";
const BASE_SIM = "https://torgeirmoberget.github.io/psy300-sim/";
const ITEMS = [{"id": "PRED-F1-03", "f": 1, "dekk": [1], "slide": {"1": 90}, "type": "pred", "rolle": "Prediksjon", "sim": 32, "app": "PSY300_Sim_Sentralmaal.html#fane=maalenivaa", "ch": null, "fasit": "D", "q": "Prøveskårene 0–5 fra lett OG vanskelig betingelse samlet danner en topuklet (bimodal) fordeling. Hvilket sentralmål beskriver en typisk student best?", "A": "Gjennomsnittet", "B": "Medianen", "C": "Modus", "D": "Ingen av dem — gruppene bør beskrives hver for seg", "expl": "Ved en bimodal fordeling beskriver ikke noe enkelt sentralmål en typisk person: gjennomsnittet (2.5) lander i dalen mellom toppene og beskriver nesten ingen. Løsningen er ikke et bedre oppsummeringstall, men å splitte på gruppe. SE alltid fordelingen før du oppsummerer den (PSY300_Sim_Datatypelaben.html)."}, {"id": "PRED-F1-04", "f": 1, "dekk": [1], "slide": {"1": 91}, "type": "pred", "rolle": "Prediksjon", "sim": 2, "app": "PSY300_Sim_Robusthetslaben.html", "ch": null, "fasit": "A", "q": "Et utvalg på 21 depresjonsskårer har gjennomsnitt ≈ 30. Én verdi feiltastes til 80. Hvilket sentralmål flytter seg MEST?", "A": "Gjennomsnittet", "B": "Medianen", "C": "Modus", "D": "Alle flytter seg like mye", "expl": "Gjennomsnittet bruker VERDIEN til hver observasjon, så én ekstremverdi drar det kraftig. Medianen bruker bare rangordningen (den rikker seg knapt), og modus bare hyppighet (den står stille). Motgiftene i demoen: trimmet og winsorisert gjennomsnitt, og transformasjon av skjeve data (PSY300_Sim_Robusthetslaben.html)."}, {"id": "PRED-F1-02", "f": 1, "dekk": [1], "slide": {"1": 109}, "type": "pred", "rolle": "Prediksjon", "sim": 3, "app": "PSY300_Sim_Utvalgsfordeling.html#fane=frihet", "ch": null, "fasit": "B", "q": "Vi beregner variansen i mange utvalg ved å dele kvadratsummen rundt utvalgets EGET gjennomsnitt på n. I snitt vil estimatet …", "A": "Treffe sann σ² — det er jo bare et gjennomsnitt", "B": "Være systematisk for LITE (med faktoren (n − 1)/n)", "C": "Være systematisk for stort", " n. Firedobler du n, ganges √n med 2, så standardfeilen halveres. Presisjon kjøpes med kvadratroten av deltakere, ikke med n selv. Spredningen i populasjonen endrer seg ikke, det er spredningen i gjennomsnittene som krymper."}, {"id": "PRED-F1-06", "f": 1, "dekk": [1, 2], "slide": {"1": 130, "2": 27}, "type": "pred", "rolle": "Prediksjon", "sim": 3, "app": "PSY300_Sim_Utvalgsfordeling.html#fane=ki", "ch": null, "fasit": "B", "q": "Vi lager 100 konfidensintervaller på 95 %, ett fra hvert av 100 utvalg fra samme populasjon. Omtrent hvor mange inneholder populasjonsgjennomsnittet μ?", "A": "Alle 100 — det er derfor de kalles konfidensintervaller", "B": "Omtrent 95, og hvilke som bommer vet vi aldri i praksis", "C": "Omtrent 95, og de som bommer kjennes igjen på at de er brede", "D": "Det avhenger av n: med stor n treffer alle", "expl": "95 % er en egenskap ved prosedyren over gjentatte utvalg, ikke ved det ene intervallet du har. Omtrent 5 av 100 bommer, og bredden røper ikke hvilke: et smalt intervall kan bomme, og et bredt kan treffe."}, {"id": "F1-5", "f": 1, "dekk": [1], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 2, "fasit": "A", "q": "I undervisningsrekkefølgen P-E-S-I-N kommer Estimering før Standardfeil fordi:", "A": "Vi må ha et estimat før det gir mening å spørre hvor presist det er", "B": "Standardfeil kan bare beregnes for normalfordelte variabler", "C": "Estimering er enklere matematikk", "D": "Parametere må være kjent før standardfeilen kan finnes", "expl": "Rekkefølgen er logisk: hvert trinn stiller neste spørsmål om det forrige. Parameteren er alltid ukjent — det er derfor vi estimerer."}, {"id": "F1-6", "f": 1, "dekk": [1], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 1, "fasit": "B", "q": "Hva er den viktigste designforskjellen mellom terapidatasettet og arbeidskravsdatasettet?", "A": "Terapistudien randomiserte, arbeidskravsstudien gjorde ikke det", "B": "Begge randomiserte, men terapistudien fulgte deltakerne over tre tidspunkter", "C": "Terapistudien er et eksperiment, arbeidskravsstudien et rent tverrsnitt", "D": "Arbeidskravsstudien manglet kontrollgruppe", "expl": "Begge er randomiserte eksperimenter (ISTDP vs. venteliste; lett vs. vanskelig prøve) — forskjellen er tidsdimensjonen (tre vs. to tidspunkter)."}, {"id": "F1-4", "f": 1, "dekk": [2], "slide": {"2": 3}, "type": "forelesning", "rolle": "Åpning", "sim": null, "app": null, "ch": 1, "fasit": "A", "q": "Variabelen Gruppe (ISTDP vs. venteliste) i terapidatasettet er målt på:", "A": "Nominalnivå", "B": "Ordinalnivå", "C": "Intervallnivå", "D": "Rationivå (forholdstallsnivå)", "expl": "To kategorier uten rangordning. At «behandling er mer enn venteliste» er substans, ikke måling."}, {"id": "F1-1", "f": 1, "dekk": [2], "slide": {"2": 4}, "type": "forelesning", "rolle": "Åpning", "sim": null, "app": null, "ch": 2, "fasit": "B", "q": "I terapistudien beregner vi gjennomsnittlig depresjonsskår for de 75 deltakerne. Tallet vi får er:", "A": "En parameter", "B": "Et estimat", "C": "En standardfeil", "D": "En operasjonalisering", "expl": "Parameteren er den ukjente verdien i populasjonen; tallet vi beregner i utvalget er vårt estimat av den."}, {"id": "PRED-F2-05", "f": 2, "dekk": [2], "slide": {"2": 8}, "type": "pred", "rolle": "Prediksjon", "sim": 32, "app": "PSY300_Sim_Sentralmaal.html", "ch": null, "fasit": "A", "q": "Vi trekker 12 tall og regner ut gjennomsnitt, median og modus. Så endrer vi ÉN verdi: den høyeste dobles. Hvilket mål flytter seg mest?", "A": "Gjennomsnittet", "B": "Medianen", "C": "Modus", "D": "Alle tre flytter seg omtrent like mye", "expl": "Gjennomsnittet bruker alle tallene og har derfor lang vektarm: ett lodd langt ute drar hele tyngdepunktet med seg. Medianen bryr seg bare om rekkefølgen, og modus bare om hvilken verdi som går igjen — begge står stille."}, {"id": "PRED-F1-07", "f": 1, "dekk": [2], "slide": {"2": 9}, "type": "pred", "rolle": "Prediksjon", "sim": 32, "app": "PSY300_Sim_Sentralmaal.html#fane=gjett", "ch": 1, "fasit": "A", "q": "Du skal gjette IQ-en til hundre tilfeldige personer, uten å få vite noe som helst om dem. Bommen straffes kvadrert. Hvilken strategi gir lavest samlet feil?", "A": "Gjett 100 hver eneste gang", "B": "Gjett tall som ligner på hvordan IQ faktisk fordeler seg", "C": "Varier litt rundt 100, men hold deg nær midten", "D": "Det spiller ingen rolle — du kan uansett ikke vite noe om dem", "expl": "Gjennomsnittet minimerer den kvadrerte feilen. Ethvert annet fast tall koster deg nøyaktig n · (bommen på sentrum)², og å gjette «som fordelingen» er verst av alt: da legger du din egen tilfeldighet oppå naturens og fordobler feilen, fra σ² til 2σ² per person. Du bommer likevel — i snitt med 15 poeng — og det tallet er standardavviket."}, {"id": "PRED-F2-06", "f": 2, "dekk": [2], "slide": {"2": 61}, "type": "pred", "rolle": "Prediksjon", "sim": 29, "app": "PSY300_Sim_Kjikvadratlaben.html", "ch": null, "fasit": "C", "q": "Du trekker 10 klinkekuler og får 9 svarte og 1 hvit. Nullhypotesen er 50/50. Hvor stor andel av alle utvalg er minst så skjeve, hvis krukka faktisk er 50/50?", "A": "Rundt 0.1 %", "B": "Rundt 1 %", "C": "Rundt 2 %", "D": "Rundt 10 %", "expl": "9–1 eller 1–9 har sannsynlighet 20/1024, og 10–0 eller 0–10 har 2/1024. Til sammen 22/1024 = 2.1 %. Vi forkaster altså 50/50 — men merk at χ² = 6.4 her, godt over 3.84."}, {"id": "PRED-F2-04", "f": 2, "dekk": [2], "slide": {"2": 63}, "type": "pred", "rolle": "Prediksjon", "sim": 7, "app": "PSY300_Sim_Pverdimaskinen.html#fane=mange", "ch": null, "fasit": "C", "q": "I data der ALLE nullhypoteser er sanne prøver du 20 ulike analyser (andre utfall, undergrupper, kovariater …). Sjansen for minst ett «signifikant» funn er omtrent:", "A": "5 %", "B": "20 %", "C": "64 %", "D": "95 %", "expl": "1 − 0.95²⁰ ≈ 64 %. Forskerens frihetsgrader er familievis feil i naturlig habitat — derfor skilles planlagte og utforskende analyser."}, {"id": "PRED-F2-03", "f": 2, "dekk": [2], "slide": {"2": 64}, "type": "pred", "rolle": "Prediksjon", "sim": 7, "app": "PSY300_Sim_Pverdimaskinen.html#fane=bias", "ch": null, "fasit": "B", "q": "100 laboratorier studerer en effekt som i sannhet er NULL (n = 40 per gruppe). Bare studier med p < ,05 publiseres. Gjennomsnittseffekten i de publiserte studiene er:", "A": "Omtrent 0 — effekten er jo null", "B": "Klart større enn 0 (typisk d ≈ 0.5)", "C": "Umulig å si noe om", "D": "Negativ, siden de fleste studier feiler", "expl": "Bare de tilfeldig største utslagene passerer p < ,05-filteret — de publiserte studiene er en selektert hale. Med d = 0 og n = 40 ligger publiserte effekter typisk rundt |d| ≈ 0,5."}, {"id": "F1-2", "f": 1, "dekk": [2], "slide": {"2": 66}, "type": "forelesning", "rolle": "Avslutning", "sim": null, "app": null, "ch": 2, "fasit": "B", "q": "Standardfeilen til gjennomsnittet beskriver:", "A": "Hvor mye enkeltpersoner varierer rundt gjennomsnittet", "B": "Hvor mye utvalgsgjennomsnittet ville variert fra utvalg til utvalg", "C": "Hvor stor målefeilen i spørreskjemaet er", "D": "Avstanden mellom gjennomsnittet og medianen", "expl": "Standardfeil er standardavviket til utvalgsfordelingen — spredningen av tenkte gjentatte utvalgs gjennomsnitt. Ikke forveksle med standardavvik (spredning av personer)."}, {"id": "F3-S1", "f": 3, "dekk": [3], "slide": {"3": 6}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 11, "app": "PSY300_Sim_Korrelasjonsdansen.html#fane=styrke", "ch": 7, "fasit": "B", "q": "Grunnskolepoeng korrelerer omtrent 0.60 med IQ målt i ung voksen alder. Hvor mye «vet» du da om noens IQ hvis du kjenner grunnskolepoengene deres?", "A": "Omtrent 60 prosent — det er jo det r sier.", "B": "Omtrent 36 prosent av variasjonen. Usikkerheten krymper fra 15 til 12 IQ-poeng.", "C": "Nesten alt — 0.60 er sterkt, så anslaget blir presist.", "D": "Ingenting — korrelasjon sier ikke noe om enkeltpersoner.", "expl": "r² = 0.60² = 0.36. Uten informasjon er beste anslag IQ = 100, og du bommer typisk med ett standardavvik — 15 poeng. Med karakterene krymper den typiske bommen til 15 · √(1 − 0.36) = 12 poeng, en reduksjon på 20 %. Grunnskolepoeng er blant de sterkeste prediktorene i psykologien, og dette er hva den er verdt for ÉN person. D er feil på en lærerik måte: korrelasjonen sier faktisk noe om enkeltpersoner — bare mye mindre enn folk tror."}, {"id": "F3-P1", "f": 3, "dekk": [3], "slide": {"3": 9}, "type": "pred", "rolle": "Prediksjon", "sim": 11, "app": "PSY300_Sim_Korrelasjonsdansen.html#fane=dans", "ch": 7, "fasit": "C", "q": "Du trekker 20 personer fra en populasjon der den sanne sammenhengen er nøyaktig null. Hvor stor korrelasjon er det rimelig å få bare av tilfeldigheter?", "A": "Under 0.05 — null er null.", "B": "Rundt 0.10.", "C": "±0.3–0.4 er helt vanlig.", "D": "Opptil 0.9.", "expl": "Ved n = 20 er ±0.3–0.4 helt vanlig når den sanne sammenhengen er null. Én korrelasjon uten konfidensintervall er en anekdote. Kjør fane 3 og se hvor mye r spretter."}, {"id": "F3-S2", "f": 3, "dekk": [3], "slide": {"3": 20}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 11, "app": "PSY300_Sim_Korrelasjonsdansen.html#fane=styrke", "ch": 7, "fasit": "B", "q": "Depresjon og undertrykkende forsvar korrelerer .48 hos disse 75 pasientene. Hva kan du konkludere?", "A": "Undertrykkende forsvar bidrar til depresjon hos omtrent en firedel av pasientene.", "B": "De to målene deler omtrent 23 % av variasjonen; hvorfor, vet vi ikke.", "C": "Forsvarsmekanismer forklarer 48 % av depresjonen.", "D": "Depresjon fører til mer undertrykkende forsvar.", "expl": "r² = .48² = .235 — altså omtrent 23 % delt variasjon. A og D er årsakspåstander som tverrsnittsdata ikke bærer, og C forveksler r med r²."}, {"id": "F3-P2", "f": 3, "dekk": [3], "slide": {"3": 23}, "type": "pred", "rolle": "Prediksjon", "sim": 11, "app": "PSY300_Sim_Korrelasjonsdansen.html#fane=simpson", "ch": 7, "fasit": "C", "q": "Vi legger på filteret Gruppe = ISTDP og kjører nøyaktig samme analyse på de 36 pasientene som faktisk fikk terapi. Hva skjer med korrelasjonene?", "A": "De blir omtrent like sterke — kanskje litt svakere med færre personer.", "B": "De blir litt svakere, men fortsatt signifikante.", "C": "De forsvinner helt, og én av dem snur fortegn.", "D": "De blir sterkere — nå er gruppen mer homogen.", "expl": "I hele utvalget er Δ-korrelasjonene .618 · .675 · .722. I terapigruppen alene: −.230 · −.081 · .066. Terapigruppen endret seg på alt, ventelisten på ingenting — gruppetilhørighet drev begge, og det er Simpsons paradoks i ekte kliniske data. Med n = 36 spenner 95 %-KI rundt r = −.23 fra −.52 til .11: mekanismespørsmålet er UBESVART, ikke avkreftet."}, {"id": "F3-S3", "f": 3, "dekk": [3], "slide": {"3": 32}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 11, "app": "PSY300_Sim_Korrelasjonsdansen.html#fane=null", "ch": 7, "fasit": "A", "q": "En studie med N = 1 200 rapporterer r = .08, p = .005. Hva er den mest presise beskrivelsen?", "A": "En liten, men sikkert påvist sammenheng som forklarer under 1 % av variasjonen.", "B": "En moderat sammenheng, siden p er godt under .05.", "C": "Et funn uten betydning — p under .01 med så mange deltakere er tilfeldig.", "D": "En sterk sammenheng; p sier at effekten er stor.", "expl": "r = .08 gir r² = .0064 — seks tideler av én prosent. Med N = 1 200 er kritisk r 0.057, så .08 er sikkert påvist. Signifikant og stor er to forskjellige spørsmål."}, {"id": "F3-S4", "f": 3, "dekk": [3], "slide": {"3": 38}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 5, "app": "PSY300_Sim_MinsteKvadrater.html#fane=data", "ch": 8, "fasit": "B", "q": "En elev har grunnskolepoeng helt i toppen — 2 standardavvik over snittet. Hva er beste anslag på IQ-en hennes?", "A": "Også omtrent 2 SD over snittet — hun er jo en topp-elev.", "B": "Omtrent 1.2 SD over snittet, altså IQ ≈ 118.", "C": "Omtrent 100 — enkeltpersoner kan man ikke si noe om.", "D": "Umulig å svare uten å vite hennes faktiske IQ.", "expl": "ẑ = r · z = 0.60 · 2 = 1.2, altså IQ ≈ 118. Prediksjonen trekker henne innover mot gjennomsnittet — det er ikke forsiktighet, det er matematikk. Galton kalte det regresjon, og det er derfor nesten alle tiltak ser ut til å virke når man velger ut de dårligste."}, {"id": "F3-P3", "f": 3, "dekk": [3], "slide": {"3": 40}, "type": "pred", "rolle": "Prediksjon", "sim": 5, "app": "PSY300_Sim_MinsteKvadrater.html#fane=kvadrat", "ch": 8, "fasit": "D", "q": "Vi skal legge en rett linje gjennom punktskyen, og kriteriet er «minst mulig feil». Hvorfor kvadrerer vi avstandene i stedet for å bruke dem som de er?", "A": "Fordi kvadrering gjør regnestykket penere.", "B": "Fordi positive og negative avvik ellers ville nulle hverandre ut.", "C": "Fordi det straffer store bom hardere enn små.", "D": "Både B og C.", "expl": "Begge deler. Kvadrering hindrer at positive og negative avvik nuller hverandre ut, OG straffer store bom hardere enn små. Kjør Sim 5 fane 2 og mal fram SSE-kurven: den bunner nøyaktig på minste-kvadraters-linja."}, {"id": "F3-P4", "f": 3, "dekk": [3], "slide": {"3": 43}, "type": "pred", "rolle": "Prediksjon", "sim": 15, "app": "PSY300_Sim_Kontrollmaskinen.html", "ch": 8, "fasit": "C", "q": "Nå legger vi begge prediktorene i samme modell. Grunnskolepoeng og foreldreinntekt korrelerer 0.30 med hverandre. Hva skjer med inntektens koeffisient?", "A": "Den blir omtrent den samme — den var jo klart signifikant.", "B": "Den krymper litt, men er fortsatt signifikant.", "C": "Den kollapser til omtrent null og blir ikke signifikant.", "D": "Den snur fortegn.", "expl": "b for inntekt faller fra 0.920 (t = 4.55, p < ,001) til 0,101 (t = 0,58, p = ,559), og β fra ,20 til ,02. Inntektens unike bidrag er ΔR² = ,0004. Sammenhengen var der, men den gikk gjennom karakterene. Å kontrollere for noe fjerner ikke bare tall — det bytter spørsmål, fra «henger de sammen?» til «henger de sammen blant elever med like karakterer?»."}, {"id": "F3-S5", "f": 3, "dekk": [3], "slide": {"3": 47}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 5, "app": "PSY300_Sim_MinsteKvadrater.html#fane=data", "ch": 8, "fasit": "A", "q": "Hvilken av disse kan du skrive på grunnlag av analysene vi nettopp kjørte?", "A": "«Undertrykkende forsvar predikerte depresjon, b = 0.210, t(73) = 4.73, p < ,001, R² = ,235.»", "B": "«Undertrykkende forsvar førte til høyere depresjonsnivå.»", "C": "«Redusert bruk av forsvarsmekanismer forklarte symptombedringen i terapigruppen.»", "D": "«Undertrykkende forsvar hadde en signifikant effekt på depresjon (p < ,001).»", "expl": "A er den eneste som holder seg til det tallene bærer. B og C er årsakspåstander, og D smugler årsak inn i ordet «effekt» — et ord som i dagligtale betyr virkning."}, {"id": "PRED-F4-02", "f": 4, "dekk": [3], "slide": {"3": 10}, "type": "pred", "rolle": "Prediksjon", "sim": 11, "app": "PSY300_Sim_Korrelasjonsdansen.html#fane=simpson", "ch": null, "fasit": "B", "q": "Innad i HVERT av tre fagfelt er sammenhengen mellom studietimer og karakter negativ. Kan den samlede sammenhengen (alle studenter under ett) være positiv?", "A": "Nei — helheten må gå samme vei som delene", "B": "Ja — hvis gruppene skiller seg systematisk i både x og y", "C": "Bare hvis utvalget er lite", "D": "Bare ved målefeil", "expl": "Simpsons paradoks: gruppetilhørighet (en tredjevariabel) kan snu fortegnet. Kontrollér for gruppe i regresjonen, så gjenstår innen-gruppe-historien."}, {"id": "PRED-F4-03", "f": 4, "dekk": [3], "slide": {"3": 13}, "type": "pred", "rolle": "Prediksjon", "sim": 5, "app": "PSY300_Sim_MinsteKvadrater.html#fane=residual", "ch": null, "fasit": "B", "q": "Residualplottet viser en tydelig trakt (spredningen øker med x), og få deltakere har høye x-verdier. Under H0 vil testen av stigningstallet …", "A": "Gi et skjevt estimat av b", "B": "Beholde b forventningsriktig, men gjøre SE-ene, p-verdiene og KI-ene upålitelige (mange falske positiver)", "C": "Være upåvirket — regresjon er robust", "D": "Snu fortegnet på r", "expl": "Heteroskedastisitet gjør ikke b skjevt, men én felles standardfeil er feil for alle — og når punktene med mest innflytelse også har mest støy, kan testen gi ~20–25 % falske positiver. Sjekk residualplottet!"}, {"id": "PRED-F5-02", "f": 5, "dekk": [], "slide": {}, "type": "pred", "rolle": "Prediksjon", "sim": 19, "app": "PSY300_Sim_Antakelsesbryteren.html", "ch": null, "fasit": "A", "q": "To grupper, ingen sann effekt. Den MINSTE gruppen (n = 15) har størst spredning (SD-forhold 3:1 mot n = 60). Student-t med α = .05: den faktiske type I-raten blir …", "A": "Klart over 5 % (liberal test)", "B": "Omtrent 5 % — testen er robust", "C": "Klart under 5 % (konservativ test)", "D": "Nøyaktig 5 % per definisjon", "expl": "Student-t bruker samlet varians, som undervurderer støyen når den lille gruppen er den mest variable → for mange falske positiver. Welch-t reparerer det. Bytt om n-ene, og testen blir konservativ i stedet."}, {"id": "F4-1", "f": 5, "dekk": [5], "slide": {}, "type": "forelesning", "rolle": "Åpner", "sim": null, "app": null, "ch": 8, "fasit": "B", "q": "Modellen er Depresjon_3mnd = 4.3 + 0.63 · Depresjon_pre. Hva betyr 0.63?", "A": "Korrelasjonen mellom de to målingene", "B": "Én enhet høyere pre-skår gir 0.63 enheter høyere predikert oppfølgingsskår", "C": "Modellen forklarer 63 % av variasjonen", "D": "Gjennomsnittlig oppfølgingsskår er 0.63", "expl": "b, r og R² er i slekt med én prediktor, men bare b har måleenhet."}, {"id": "F4-2", "f": 5, "dekk": [5], "slide": {}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": null, "app": null, "ch": 8, "fasit": "B", "q": "Regresjonslinjen legges slik at:", "A": "Den går gjennom flest mulig datapunkter", "B": "Summen av kvadrerte avstander fra punktene til linjen er minst mulig", "C": "Like mange punkter ligger over som under", "D": "Den går gjennom gjennomsnittet av x og maksimum av y", "expl": "«Best fit» betyr minimert samlet kvadrert feil — linjen treffer sjelden noen punkter eksakt (jf. Sim 5)."}, {"id": "F4-4", "f": 5, "dekk": [5], "slide": {}, "type": "forelesning", "rolle": "Avslutning", "sim": null, "app": null, "ch": 8, "fasit": "B", "q": "Residualet for en deltaker er:", "A": "Avstanden fra deltakerens skår til gjennomsnittet", "B": "Differansen mellom observert og predikert verdi", "C": "Deltakerens standardfeil", "D": "Målefeilen i instrumentet", "expl": "Residual = det modellen ikke fanger. Avvik fra gjennomsnittet er residualet i den «tomme» modellen uten prediktorer."}, {"id": "F4-5", "f": 5, "dekk": [5], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 8, "fasit": "A", "q": "I modellen Selvtillit_post ~ Selvtillit_pre + Betingelse er b for Betingelse −0.76. Riktig tolkning:", "A": "Vanskelig-gruppen ligger 0.76 lavere i predikert post-selvtillit enn lett-gruppen, ved samme før-skår", "B": "Selvtilliten faller 0.76 fra pre til post", "C": "Betingelse korrelerer −.76 med selvtillit", "D": "76 % av effekten skyldes betingelsen", "expl": "«Holdt konstant»-tolkningen er gevinsten ved multippel regresjon; koeffisienten er ikke en endringsskår."}, {"id": "F4-6", "f": 5, "dekk": [5], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 8, "fasit": "B", "q": "Modellen er estimert på prøveskårer 0–5. En kollega predikerer selvtillit for skåre 8. Problemet er:", "A": "Ingenting — modellen er lineær, så den gjelder overalt", "B": "Prediksjon utenfor observert område er uten empirisk støtte", "C": "Regresjon kan bare predikere gjennomsnittet", "D": "Man må først standardisere variablene", "expl": "Linearitet er antatt innenfor dataområdet; utenfor er det ren antakelse (ekstrapolering)."}, {"id": "F5-1", "f": 4, "dekk": [4], "slide": {}, "type": "forelesning", "rolle": "Åpner", "sim": null, "app": null, "ch": 9, "fasit": "B", "q": "Vi sammenligner depresjon ved oppfølging mellom ISTDP- og ventelistegruppen. Riktig test:", "A": "Paret t-test", "B": "Uavhengig t-test", "C": "En-utvalgs t-test", "D": "Korrelasjon", "expl": "To ulike grupper personer. Paret krever at samme (eller matchede) personer leverer begge skårene."}, {"id": "F5-2", "f": 4, "dekk": [4], "slide": {}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": null, "app": null, "ch": 9, "fasit": "B", "q": "I t = (M1 − M2) / SE_diff er nevneren:", "A": "Standardavviket til skårene i det største utvalget", "B": "Standardfeilen til differansen mellom gjennomsnittene", "C": "Den samlede variansen i begge gruppene", "D": "Effektstørrelsen", "expl": "t er signal delt på støy: observert forskjell mot forskjellen vi uansett ville sett mellom tilfeldige utvalg."}, {"id": "F5-4", "f": 4, "dekk": [4], "slide": {}, "type": "forelesning", "rolle": "Avslutning", "sim": null, "app": null, "ch": 3, "fasit": "B", "q": "Cohens d skiller seg fra p ved at d:", "A": "Alltid er mindre enn p", "B": "Ikke påvirkes systematisk av utvalgsstørrelsen", "C": "Bare kan beregnes i eksperimenter", "D": "Forteller om funnet er signifikant", "expl": "d = forskjell i standardavviksenheter; p krymper med økende n selv når d er konstant."}, {"id": "F5-5", "f": 4, "dekk": [4], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 9, "fasit": "B", "q": "Hovedgevinsten ved paret t-test fremfor uavhengig, når designet tillater det:", "A": "Den krever færre antakelser", "B": "Stabile forskjeller mellom personer fjernes fra støyleddet", "C": "Den gir alltid lavere p", "D": "Den unngår regresjon mot gjennomsnittet", "expl": "Hver person er sin egen kontroll; gevinsten forutsetter at pre og post korrelerer betydelig — «alltid» er feil."}, {"id": "F5-6", "f": 4, "dekk": [4], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 9, "fasit": "C", "q": "Uavhengig t-test med n1 = 38 og n2 = 37 har df =", "A": "75", "B": "74", "C": "73", "D": "37", "expl": "(n1 − 1) + (n2 − 1) = N − 2: ett gjennomsnitt estimert per gruppe."}, {"id": "F6-1", "f": 6, "dekk": [6], "slide": {}, "type": "forelesning", "rolle": "Åpner", "sim": null, "app": null, "ch": 11, "fasit": "B", "q": "Med tre grupper kunne vi kjørt tre parvise t-tester. Hovedproblemet:", "A": "t-tester virker ikke med tre grupper", "B": "Familievis feilrate stiger med antall tester", "C": "Gruppene får ulik n", "D": "Vi mister frihetsgrader", "expl": "Tre tester à α = .05 gir ~14 % sjanse for minst én falsk positiv (jf. Sim 21). Det er inferensielt uforsvarlig, ikke teknisk umulig."}, {"id": "F6-2", "f": 6, "dekk": [6], "slide": {}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": null, "app": null, "ch": 11, "fasit": "B", "q": "F i enveis-ANOVA er forholdet mellom:", "A": "Største og minste gruppegjennomsnitt", "B": "Variasjon mellom gruppegjennomsnittene og variasjon innad i gruppene", "C": "Forklart varians og total varians", "D": "Utvalgsstørrelse og antall grupper", "expl": "Samme signal/støy-logikk som t (t² = F med to grupper). «Forklart/total» beskriver η², ikke F."}, {"id": "F6-4", "f": 6, "dekk": [6], "slide": {}, "type": "forelesning", "rolle": "Avslutning", "sim": null, "app": null, "ch": 11, "fasit": "B", "q": "Hensikten med Bonferroni-korreksjon etter en signifikant F:", "A": "Øke styrken i de parvise testene", "B": "Holde samlet type I-risiko på α på tvers av de parvise testene", "C": "Justere for ulik gruppestørrelse", "D": "Teste om variansene er like", "expl": "α deles på antall sammenligninger; korreksjonen koster styrke — prisen for kontrollert feilrate."}, {"id": "F6-5", "f": 6, "dekk": [6], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 3, "fasit": "A", "q": "Η² = .30 i enveis-ANOVA-en betyr:", "A": "30 % av variasjonen i utfallet ligger mellom gruppene", "B": "Gruppene skiller seg med 0.30 standardavvik", "C": "30 % sjanse for at H0 er falsk", "D": "F-verdien er 0.30", "expl": "η² = SS_mellom/SS_total — ANOVA-ens R². Ikke forveksle med d (standardavviksenheter)."}, {"id": "F6-6", "f": 6, "dekk": [6], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 11, "fasit": "B", "q": "Enveis-ANOVA med 3 grupper og N = 75 har df =", "A": "F(3, 75)", "B": "F(2, 72)", "C": "F(2, 74)", "D": "F(3, 72)", "expl": "df_mellom = k − 1 = 2; df_innen = N − k = 72."}, {"id": "F7-1", "f": 7, "dekk": [7], "slide": {}, "type": "forelesning", "rolle": "Åpner", "sim": null, "app": null, "ch": 13, "fasit": "B", "q": "En Gruppe × Kjønn-interaksjon betyr at:", "A": "Både gruppe og kjønn påvirker utfallet", "B": "Effekten av gruppe er forskjellig for kvinner og menn", "C": "Gruppe og kjønn korrelerer", "D": "Kjønnseffekten er størst", "expl": "Interaksjon = betinget effekt. «Begge har effekt» er to hovedeffekter — ikke en interaksjon."}, {"id": "F7-3", "f": 7, "dekk": [7], "slide": {}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": null, "app": null, "ch": 13, "fasit": "B", "q": "I et 2 × 2-design bedres kvinner mye av behandling og menn ikke i det hele tatt. Hovedeffekten av behandling er «signifikant, moderat». Faren ved å rapportere bare den?", "A": "Ingen — hovedeffekten oppsummerer korrekt", "B": "Den gjennomsnittlige effekten beskriver ingen av kjønnene godt", "C": "Hovedeffekter kan ikke tolkes i faktorielle design", "D": "Kjønn blir en konfunderende variabel", "expl": "Ved kvalifiserende interaksjon er «gjennomsnittseffekten» en fiksjon — undersøk enkle effekter. Men hovedeffekter ER tolkbare når interaksjonen er liten."}, {"id": "F7-4", "f": 7, "dekk": [7], "slide": {}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": null, "app": null, "ch": 16, "fasit": "C", "q": "Kjikvadrat-uavhengighetstesten (f.eks. Medisinbruk × Gruppe) ligner mest på hvilken del av en faktoriell ANOVA?", "A": "Hovedeffekten av første faktor", "B": "Hovedeffekten av andre faktor", "C": "Interaksjonsleddet", "D": "Feilleddet", "expl": "Uavhengighetstesten spør om fordelingen av én kategorisk variabel avhenger av nivået på den andre — strukturelt en interaksjon, med frekvenser i stedet for gjennomsnitt."}, {"id": "F7-5", "f": 7, "dekk": [7], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 13, "fasit": "B", "q": "Et 2 × 3 faktorielt design har:", "A": "5 celler", "B": "6 celler", "C": "2 interaksjoner", "D": "3 hovedeffekter", "expl": "2 × 3 = 6 kombinasjoner; designet har to hovedeffekter og én interaksjon."}, {"id": "F7-6", "f": 7, "dekk": [7], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 13, "fasit": "B", "q": "I arbeidskravsdataene er Betingelse × Kjønn-interaksjonen F(1, 387) = 4.95, p = .027, partiell eta² = .013. Beste karakteristikk:", "A": "Stor og viktig effekt", "B": "Signifikant, men liten — tolkes med forsiktighet", "C": "Ikke-signifikant", "D": "Bevis på at kjønn forårsaker sårbarhet", "expl": "Signifikans og størrelse er ulike akser; ~1 % forklart varians er lite, og kjønn er målt, ikke manipulert."}, {"id": "F8-1", "f": 8, "dekk": [8], "slide": {}, "type": "forelesning", "rolle": "Åpner", "sim": null, "app": null, "ch": 14, "fasit": "B", "q": "Hovedfordelen med gjentatte målinger fremfor rene mellomgruppedesign:", "A": "Flere deltakere", "B": "Stabile forskjeller mellom personer fjernes fra feilleddet", "C": "Ingen antakelser å sjekke", "D": "Tidseffekter blir kausalt tolkbare", "expl": "Samme logikk som paret t. Tid er ikke randomisert — en «tidseffekt» kan skyldes alt som følger med tiden."}, {"id": "F8-2", "f": 8, "dekk": [8], "slide": {}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": null, "app": null, "ch": 14, "fasit": "B", "q": "Mauchlys test er signifikant (sfærisitet brutt). Standard håndtering:", "A": "Bytte til uavhengige t-tester", "B": "Rapportere Greenhouse–Geisser-korrigerte frihetsgrader", "C": "Fjerne det midterste tidspunktet", "D": "Ignorere det hvis n > 30", "expl": "Greenhouse–Geisser-epsilon krymper df og gjør testen ærlig. Store utvalg reparerer ikke brutte antakelser om kovariansstruktur."}, {"id": "F8-4", "f": 8, "dekk": [8], "slide": {}, "type": "forelesning", "rolle": "Avslutning", "sim": null, "app": null, "ch": 6, "fasit": "B", "q": "Også ventelistegruppen bedres noe fra pre til post. Beste forklaring?", "A": "Behandlingen har lekket over", "B": "Spontan bedring og regresjon mot gjennomsnittet", "C": "Målefeil i instrumentet", "D": "Det beviser at terapien er virkningsløs", "expl": "Folk søker hjelp på sitt verste; noe bedring kommer av seg selv — derfor trengs kontrollgruppen, og derfor er interaksjonen testen."}, {"id": "F8-5", "f": 8, "dekk": [8], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 14, "fasit": "B", "q": "I den blandede ANOVA-en på depresjon er Tid og Gruppe henholdsvis:", "A": "Begge innen-gruppe-faktorer", "B": "Innen-gruppe-faktor og mellom-gruppe-faktor", "C": "Mellom-gruppe-faktor og innen-gruppe-faktor", "D": "Begge mellom-gruppe-faktorer", "expl": "Alle måles på alle tidspunkter (innen); hver deltaker er i bare én gruppe (mellom). Sjekk alltid: leverer samme person data på alle nivåer?"}, {"id": "F8-6", "f": 8, "dekk": [8], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 14, "fasit": "B", "q": "En uavhengig t-test på endringsskårene (post − pre) mellom gruppene gir t = 3.1. Forholdet til den blandede ANOVA-ens Tid × Gruppe-interaksjon (to tidspunkter)?", "A": "De tester forskjellige ting", "B": "F_interaksjon = t² ≈ 9.6 — samme test", "C": "ANOVA-en er alltid strengere", "D": "t-testen krever sfærisitet", "expl": "Med to tidspunkter er interaksjonen identisk med endringsskår-testen, og sfærisitet er trivielt oppfylt."}, {"id": "F9-1", "f": 9, "dekk": [9], "slide": {}, "type": "forelesning", "rolle": "Testvalg", "sim": null, "app": null, "ch": 16, "fasit": "A", "q": "I terapistudien (N = 75) vil vi vite om kjønnsfordelingen avviker fra en forventet 50/50-fordeling. Én kategorisk variabel med to nivåer, ingen gruppering. Hvilken analyse er riktig?", "A": "Kjikvadrat tilpasningstest", "B": "Kjikvadrat uavhengighetstest", "C": "Uavhengig t-test", "D": "En-utvalgs t-test", "expl": "Én kategorisk variabel mot en teoretisk fordeling → tilpasningstest. Uavhengighetstesten krever to kategoriske variabler."}, {"id": "F9-2", "f": 9, "dekk": [9], "slide": {}, "type": "forelesning", "rolle": "Testvalg", "sim": null, "app": null, "ch": 16, "fasit": "B", "q": "Vi vil vite om kjønn henger sammen med medisinbruk (ja/nei). To kategoriske variabler, samme deltakere, ingen gjentatte målinger. Hvilken analyse er riktig?", "A": "Kjikvadrat tilpasningstest", "B": "Kjikvadrat uavhengighetstest", "C": "Uavhengig t-test", "D": "Korrelasjon (Pearson)", "expl": "To kategoriske variabler → uavhengighetstest (en «frekvens-interaksjon», jf. F7)."}, {"id": "F9-3", "f": 9, "dekk": [9], "slide": {}, "type": "forelesning", "rolle": "Testvalg", "sim": null, "app": null, "ch": 9, "fasit": "B", "q": "Vi sammenligner depresjonsskår ved oppfølging mellom ISTDP-gruppen og ventelistegruppen. To uavhengige grupper, ett kontinuerlig utfall, én måling per deltaker. Hvilken analyse er riktig?", "A": "Paret t-test", "B": "Uavhengig t-test", "C": "Enveis-ANOVA", "D": "Kjikvadrat", "expl": "To uavhengige grupper, kontinuerlig utfall målt én gang. (Enveis-ANOVA er ikke galt — t² = F — men t-testen er det presise valget.)"}, {"id": "F9-4", "f": 9, "dekk": [9], "slide": {}, "type": "forelesning", "rolle": "Testvalg", "sim": null, "app": null, "ch": 9, "fasit": "B", "q": "Vi ser bare på terapigruppen og spør om depresjonen endrer seg fra pre til post. Samme deltakere målt to ganger, ett kontinuerlig utfall, ingen sammenligningsgruppe. Hvilken analyse er riktig?", "A": "Uavhengig t-test", "B": "Paret t-test", "C": "Blandet ANOVA", "D": "Regresjon", "expl": "Samme personer, to tidspunkter, én gruppe. Vanligste feil: å glemme at målingene er avhengige."}, {"id": "F9-5", "f": 9, "dekk": [9], "slide": {}, "type": "forelesning", "rolle": "Testvalg", "sim": null, "app": null, "ch": 14, "fasit": "C", "q": "Vi vil vite om terapigruppen bedres MER enn ventelisten fra pre til oppfølging. To grupper, to tidspunkter, ett kontinuerlig utfall — spørsmålet gjelder forskjellen i endring. Hvilken analyse er riktig?", "A": "Uavhengig t-test på oppfølgingsskårene", "B": "Paret t-test i hver gruppe for seg", "C": "Blandet ANOVA — Tid × Gruppe-interaksjonen", "D": "Korrelasjon mellom pre og oppfølging", "expl": "Differensiell endring = interaksjonen. «Signifikant i den ene, ikke i den andre» er IKKE en test av forskjellen."}, {"id": "F9-6", "f": 9, "dekk": [9], "slide": {}, "type": "forelesning", "rolle": "Testvalg", "sim": null, "app": null, "ch": 8, "fasit": "B", "q": "Vi vil vite om baseline-depresjon predikerer depresjon ved 3 måneder, og hvor mange skalapoeng utfallet endrer seg per poeng på baseline. To kontinuerlige variabler, og svaret skal være i skalaens egne enheter. Hvilken analyse er riktig?", "A": "Korrelasjon", "B": "Enkel lineær regresjon", "C": "Paret t-test", "D": "Enveis-ANOVA", "expl": "«Hvor mye per enhet» krever et stigningstall — korrelasjonen gir bare styrke og retning."}, {"id": "F9-7", "f": 9, "dekk": [9], "slide": {}, "type": "forelesning", "rolle": "Testvalg", "sim": null, "app": null, "ch": 11, "fasit": "B", "q": "Vi sammenligner baseline-depresjon mellom de tre nivåene av tidligere behandling (ingen / ett / flere forsøk). Tre uavhengige grupper, ett kontinuerlig utfall. Hvilken analyse er riktig?", "A": "Tre uavhengige t-tester", "B": "Enveis-ANOVA med post hoc", "C": "Kjikvadrat", "D": "Blandet ANOVA", "expl": "Tre grupper, kontinuerlig utfall. Tre t-tester gir ukontrollert familievis feilrate."}, {"id": "F9-8", "f": 9, "dekk": [9], "slide": {}, "type": "forelesning", "rolle": "Testvalg", "sim": null, "app": null, "ch": 8, "fasit": "B", "q": "I arbeidskravdataene vil vi vite om effekten av betingelse på statistikk-selvtillit avhenger av hvor selvkritisk studenten er. Selvkritikk er målt kontinuerlig, og vi vil ikke kaste bort informasjon ved å dele den opp. Hvilken analyse er riktig?", "A": "Faktoriell ANOVA med mediansplittet selvkritikk", "B": "Moderert multippel regresjon med produktledd", "C": "Korrelasjon mellom selvkritikk og selvtillit", "D": "Enveis-ANOVA over selvkritikk-kvintiler", "expl": "Kontinuerlig moderator → produktledd; kategorisering kaster informasjon og styrke (MacCallum mfl., 2002)."}, {"id": "F2-1", "f": 2, "dekk": [], "slide": {}, "type": "forelesning", "rolle": "Åpner", "sim": null, "app": null, "ch": 2, "fasit": "B", "q": "En t-test gir p = .03. Hva betyr det?", "A": "3 % sannsynlighet for at nullhypotesen er sann", "B": "Sannsynligheten for et resultat minst like ekstremt som vårt, gitt at nullhypotesen er sann, er 3 %", "C": "97 % sannsynlighet for at funnet replikeres", "D": "Effekten er liten, men reell", "expl": "p er P(data | H0), ikke P(H0 | data) — den vanligste misforståelsen i hele faget."}, {"id": "F2-3", "f": 2, "dekk": [], "slide": {}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": null, "app": null, "ch": 3, "fasit": "B", "q": "Med n = 10 000 finner en studie r = .03, p < ,001. Beste tolkning?", "A": "En sterk sammenheng, siden p er svært lav", "B": "En triviell sammenheng, svært presist målt", "C": "Resultatet må skyldes en regnefeil", "D": "Sammenhengen er sterk, men bare i store utvalg", "expl": "p kombinerer effekt og n; med enorme utvalg blir trivielle effekter «signifikante». r = .03 er under 0.1 % delt varians."}, {"id": "F2-4", "f": 2, "dekk": [], "slide": {}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": null, "app": null, "ch": 16, "fasit": "C", "q": "Terapidatasettet har 44 kvinner og 31 menn; vi tester mot 50/50. Forventet antall kvinner under H0?", "A": "44", "B": "50", "C": "37,5", "D": "31", "expl": "Forventet = N × 0.5 = 75/2 = 37.5. Kjikvadrat sammenligner observert med forventet — og «forventet» kommer alltid fra H0."}, {"id": "F2-5", "f": 2, "dekk": [], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 1, "fasit": "A", "q": "Depresjonsskårene ved baseline er venstreskjeve (lang hale mot lave verdier). Hva gjelder da typisk?", "A": "Gjennomsnittet er lavere enn medianen", "B": "Gjennomsnittet er høyere enn medianen", "C": "Gjennomsnitt og median er like", "D": "Medianen kan ikke beregnes for skjeve fordelinger", "expl": "Halen drar gjennomsnittet med seg — mot venstre her."}, {"id": "F2-6", "f": 2, "dekk": [], "slide": {}, "type": "forelesning", "rolle": "Reserve", "sim": null, "app": null, "ch": 2, "fasit": "B", "q": "Α = .05 er risikoen for å:", "A": "Beholde en falsk nullhypotese", "B": "Forkaste en sann nullhypotese", "C": "Trekke et skjevt utvalg", "D": "Få en effektstørrelse under 0.5", "expl": "Type I-feil. Å beholde en falsk H0 er type II (β). α er en villet, tallfestet feilrate."}, {"id": "PRED-F2-02", "f": 2, "dekk": [], "slide": {}, "type": "pred", "rolle": "Prediksjon", "sim": 3, "app": "PSY300_Sim_Utvalgsfordeling.html#fane=ki", "ch": null, "fasit": "B", "q": "Vi trekker 100 studier og tegner 95 %-konfidensintervallene. Omtrent hvor mange bommer på populasjonsgjennomsnittet μ?", "A": "0", "B": "Ca. 5", "C": "Ca. 50", "D": "Vet ikke", "expl": "«95 %» beskriver metoden over mange studier: omtrent 5 av 100 intervaller bommer på den sanne verdien."}, {"id": "PRED-F4-01", "f": 4, "dekk": [4], "slide": {"4": 21}, "type": "pred", "rolle": "Prediksjon", "sim": 16, "app": "PSY300_Sim_Ttesten.html#fane=se", "ch": null, "fasit": "B", "q": "Gjennomsnittsforskjellen mellom to grupper holdes fast, men innengruppe-SD dobles. Hva skjer med p-verdien?", "A": "Uendret — forskjellen er jo den samme", "B": "Den blir større (mindre signifikant)", "C": "Den blir mindre", "D": "Vet ikke", "expl": "Både p og d måles i enheter av innengruppestøy: dobles SD, halveres d og t krymper — p stiger."}, {"id": "F4-S1", "f": 4, "dekk": [4], "slide": {"4": 9}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 16, "app": "PSY300_Sim_Ttesten.html#fane=nhst", "ch": 9, "fasit": "B", "q": "Vi stokker om gruppelappene 10 000 ganger og finner at 30 av omstokkingene ga en forskjell minst like stor som den vi observerte. Hva er p-verdien, og hva betyr den?", "A": "p = .003 — sannsynligheten for at behandlingen ikke virker", "B": "p = .003 — hvor ofte tilfeldig gruppering alene lager en forskjell så stor", "C": "p = .997 — sannsynligheten for at behandlingen virker", "D": "p = .003 — sannsynligheten for at vi har gjort en feil", "expl": "30 av 10 000 er .003. En p-verdi er en andel: hvor ofte tilfeldigheter alene klarer det du klarte. Den er regnet ut UNDER FORUTSETNING AV at nullhypotesen er sann, og kan derfor ikke si noe om hvor sannsynlig den forutsetningen er. A og C er de to klassiske speilvendingene."}, {"id": "F4-S2", "f": 4, "dekk": [4], "slide": {"4": 29}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 16, "app": "PSY300_Sim_Ttesten.html#fane=ki", "ch": 9, "fasit": "C", "q": "En studie rapporterer 95 %-konfidensintervallet [2.1, 8.7] for forskjellen mellom to behandlinger. Hva betyr «95 %»?", "A": "Det er 95 % sannsynlig at den sanne forskjellen ligger mellom 2.1 og 8.7", "B": "95 % av pasientene forbedret seg med mellom 2.1 og 8.7 poeng", "C": "Metoden treffer den sanne forskjellen i 95 av 100 slike studier", "D": "Vi kan være 95 % sikre på at behandlingen virker", "expl": "«95 %» er en egenskap ved METODEN over mange studier, ikke ved det ene intervallet du har. Den sanne forskjellen er et fast tall — enten ligger den innenfor eller ikke. Det er intervallet som er tilfeldig, fordi det er bygget av data som kunne vært andre. B forveksler intervallet med spredningen mellom personer."}, {"id": "F4-S3", "f": 4, "dekk": [4], "slide": {"4": 40}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 16, "app": "PSY300_Sim_Ttesten.html#fane=effekt", "ch": 9, "fasit": "B", "q": "En studie dobler utvalget sitt, alt annet likt. Hva skjer med t og med Cohens d?", "A": "Begge vokser", "B": "t vokser, d er omtrent uendret", "C": "d vokser, t er omtrent uendret", "D": "Begge er uendret", "expl": "t har standardfeilen i nevneren, og den krymper når n vokser — så t stiger. d har standardavviket i nevneren, og det beskriver hvor ulike folk er, uansett hvor mange du måler. Derfor krever APA begge tallene: p sier om funnet er til å stole på, d sier om det betyr noe."}, {"id": "F4-S4", "f": 4, "dekk": [4], "slide": {"4": 49}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 16, "app": "PSY300_Sim_Ttesten.html#fane=forut", "ch": 9, "fasit": "B", "q": "Levene på vårt eksempel er ikke signifikant (p = .22). Bør du bruke Student eller Welch?", "A": "Student — antakelsen om like varianser holder", "B": "Welch — den koster nesten ingenting når variansene er like", "C": "Spiller ingen rolle, de gir alltid samme svar", "D": "Mann–Whitney, siden vi ikke vet", "expl": "Levene har lav styrke ved små utvalg — og med p = .22 har vi ikke vist at variansene er like, bare at vi ikke klarte å vise at de er ulike, så «ikke signifikant» er svakt belegg for at variansene faktisk er like. Welch taper nesten ingen styrke når de ER like, og redder feilraten når de ikke er det. C er nesten sant — de gir like svar ved balanserte grupper med like varianser — men ikke ellers."}, {"id": "PRED-F4-04", "f": 4, "dekk": [4], "slide": {"4": 45}, "type": "pred", "rolle": "Prediksjon", "sim": 16, "app": "PSY300_Sim_Ttesten.html#fane=forut", "ch": 9, "fasit": "C", "q": "To grupper, ingen sann forskjell. Den lille gruppen (n = 10) har stor spredning, den store (n = 50) har liten. Hvor ofte roper Student-testen «signifikant funn»?", "A": "5 % — det er jo det alfa er", "B": "Ca. 10 %", "C": "Ca. 30 %", "D": "Nesten aldri", "expl": "Student slår de to variansene sammen til ett felles anslag. Når den lille gruppen har den store spredningen, blir det felles anslaget for lite, standardfeilen for liten og t for stor. Simuleringen gir omtrent 33 %. Welchs korreksjon lander på 5 % uansett — derfor krysser vi av for den hver gang."}, {"id": "PRED-F5-01", "f": 5, "dekk": [], "slide": {}, "type": "pred", "rolle": "Prediksjon", "sim": 7, "app": "PSY300_Sim_Pverdimaskinen.html#fane=mange", "ch": null, "fasit": "B", "q": "Vi kjører 10 uavhengige tester i en verden uten sanne effekter (α = .05). Hva er sjansen for minst én falsk positiv?", "A": "5 %", "B": "Ca. 40 %", "C": "0.5 %", "D": "Vet ikke", "expl": "1 − 0.95^10 ≈ 40 %. Denne familievise inflasjonen er grunnen til at én ANOVA slår mange t-tester."}, {"id": "PRED-F6-01", "f": 6, "dekk": [], "slide": {}, "type": "pred", "rolle": "Prediksjon", "sim": 24, "app": "PSY300_Sim_Interaksjonsbyggeren.html", "ch": null, "fasit": "B", "q": "Vi setter medisinandelene identiske i begge grupper og kjører uavhengighetstesten i 1 000 studier. p-verdiene blir…", "A": "Alle over .05", "B": "Uniforme — ca. 5 % under .05", "C": "Alle omtrent 1", "D": "Vet ikke", "expl": "Når uavhengighet er eksakt sann, er p-verdiene uniforme: ca. 5 % havner under .05 — kjikvadrat følger samme NHST-logikk som alle andre tester."}, {"id": "PRED-F7-01", "f": 7, "dekk": [], "slide": {}, "type": "pred", "rolle": "Prediksjon", "sim": 25, "app": "PSY300_Sim_InnenPerson.html", "ch": null, "fasit": "A", "q": "Innen-person-korrelasjonen r(pre, post) økes fra 0 til 0.9, alt annet likt. Hva skjer med den parede t-verdien?", "A": "Den øker kraftig", "B": "Den synker", "C": "Den er uendret", "D": "Vet ikke", "expl": "Standardfeilen for differansen krymper med 2·r·s₁·s₂, så samme gjennomsnittsendring gir mye større t — kraften i innen-person-design."}, {"id": "PRED-F8-01", "f": 8, "dekk": [], "slide": {}, "type": "pred", "rolle": "Prediksjon", "sim": 26, "app": "PSY300_Sim_RegresjonMotGjennomsnittet.html", "ch": null, "fasit": "B", "q": "Vi velger de 25 % som skårer dårligst ved pre, og måler dem igjen senere — UTEN noe tiltak. Gjennomsnittet deres ved post vil …", "A": "Være omtrent det samme — ingenting har jo skjedd", "B": "Bli bedre — de flytter seg mot gjennomsnittet", "C": "Bli verre — problemene forsterker seg", "D": "Umulig å si uten flere opplysninger", "expl": "Regresjon mot gjennomsnittet: en ekstrem skår er dels sant nivå, dels uflaks i målingen — og uflaksen gjentar seg ikke. Derfor bedres også ventelistegrupper, og derfor trengs kontrollgruppen."}, {"id": "PRED-F8-02", "f": 8, "dekk": [], "slide": {}, "type": "pred", "rolle": "Prediksjon", "sim": 27, "app": "PSY300_Sim_Sfaerisitet.html", "ch": null, "fasit": "A", "q": "I pre/post/oppfølgingsdata korrelerer nabomålingene sterkere enn endepunktene (sfærisitet brutt, ε < 1). ANOVA for gjentatte målinger UTEN korreksjon, under H0: type I-raten blir …", "A": "Over 5 % (liberal test)", "B": "Nøyaktig 5 % — F-testen er robust", "C": "Under 5 % (konservativ test)", "D": "Null — ingen effekter finnes jo", "expl": "Ulik varians i differanseskårene gjør at den ukorrigerte testen later som den har flere frihetsgrader enn dataene gir → for mange falske positiver. Greenhouse–Geisser krymper df med ε og gjenoppretter ≈ 5 %."}, {"id": "F3-P5", "f": 3, "dekk": [3], "slide": {"3": 63}, "type": "pred", "rolle": "Prediksjon", "sim": 11, "app": "PSY300_Sim_Korrelasjonsdansen.html#fane=ki", "ch": 7, "fasit": "B", "q": "En studie finner r = .90 hos 30 personer. Vi regner ut et 95 % konfidensintervall. Hvordan ligger intervallet rundt .90?", "A": "Like langt ned som opp — konfidensintervaller er symmetriske om estimatet.", "B": "Lengre ned enn opp, fordi r ikke kan passere 1.", "C": "Lengre opp enn ned, fordi høye korrelasjoner er ustabile.", "D": "Symmetrisk, siden n = 30 er stort nok til at fordelingen er normal.", "expl": "Intervallet blir [.799, .952]: .101 ned og bare .052 opp. Taket på 1 klemmer fordelingen sammen på oversiden, og derfor går veien om Fishers z. Det er nettopp derfor man ikke kan skrive r ± 1.96 · SE."}, {"id": "F3-S6", "f": 3, "dekk": [3], "slide": {"3": 61}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 11, "app": "PSY300_Sim_Korrelasjonsdansen.html#fane=test", "ch": 7, "fasit": "C", "q": "I korrelasjonsmatrisen står paret forsvar–aggresjonshemming: r = −.09, p = .435, n = 75. Hvilken setning hører hjemme i resultatdelen?", "A": "«Det var en svak tendens til negativ sammenheng mellom de to målene.»", "B": "«Det var ingen sammenheng mellom de to målene.»", "C": "«De to målene hang ikke signifikant sammen, r = −.09, p = .435.»", "D": "«Sammenhengen var for svak til at den lot seg teste.»", "expl": "A gjør en ikke-signifikant koeffisient til et halvt funn — den vanligste feilen. B påstår at nullhypotesen er sann, og det kan en test aldri vise: konfidensintervallet går fra −.31 til +,14, så en moderat sammenheng er fortsatt mulig. D er bare feil. C rapporterer tallet, sier hva testen viste, og lover ikke mer."}, {"id": "F3-P6", "f": 3, "dekk": [3], "slide": {"3": 68}, "type": "pred", "rolle": "Prediksjon", "sim": 11, "app": "PSY300_Sim_MinsteKvadrater.html#fane=multippel", "ch": 8, "fasit": "B", "q": "Vi har en modell med én prediktor og legger inn en til i blokk 2. Hva kan skje med R²?", "A": "Den kan falle, hvis den nye prediktoren ikke bidrar med noe.", "B": "Den kan bare stige eller stå stille — aldri falle.", "C": "Den stiger alltid merkbart når man legger til en prediktor.", "D": "Den er uendret, siden den nye prediktoren korrelerer svakt med utfallet.", "expl": "R² kan matematisk aldri falle når du legger til en prediktor: modellen kan i verste fall gi den vekten null. Derfor er R² ubrukelig til å sammenligne modeller med ulikt antall prediktorer — og derfor finnes justert R², som trekker fra for hver prediktor og godt kan falle. Her: R² .235 → .262 (ΔR² = .027), mens justert R² bare gikk .224 → .241."}, {"id": "F3-S7", "f": 3, "dekk": [3], "slide": {"3": 72}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 15, "app": "PSY300_Sim_Kontrollmaskinen.html", "ch": 8, "fasit": "C", "q": "To prediktorer i samme modell korrelerer r₁₂ = .90 med hverandre. VIF = 1 / (1 − r₁₂²). Hva blir VIF, og hva betyr det?", "A": "VIF = 1.90 — godt innenfor, ingenting å bemerke.", "B": "VIF = 0.19 — under 1, altså ingen kollinearitet.", "C": "VIF = 5.26 — over tommelfingergrensen på 5, og standardfeilene er blåst opp.", "D": "VIF = 10.26 — uholdbart; modellen kan ikke tolkes.", "expl": "1 − .90² = .19, og 1/,19 = 5.26. VIF sier hvor mange ganger større variansen til koeffisienten er blitt fordi prediktorene overlapper; √5.26 = 2.3, så standardfeilen er mer enn doblet. D er verdien ved r₁₂ = .95 — grensen er brattere enn folk tror. I arbeidskravet blir VIF ≈ 1, og da rapporterer man det og går videre."}, {"id": "F5-A1", "f": 5, "dekk": [5], "slide": {"5": 3}, "type": "forelesning", "rolle": "Åpning", "sim": 22, "app": "PSY300_Sim_Anova.html#fane=hvorfor", "ch": 9, "fasit": "B", "q": "Forrige forelesning endte med t = (x̄₁ − x̄₂) / SE. Si med to ord hva som står over og under brøkstreken.", "A": "Over: effekten. Under: utvalgsstørrelsen.", "B": "Over: signalet vi leter etter. Under: hvor mye det støyer.", "C": "Over: variasjonen mellom gruppene. Under: variasjonen innen dem.", "D": "Over: forskjellen. Under: sjansen for at den er tilfeldig.", "expl": "B. Telleren er forskjellen vi er ute etter; nevneren er hvor mye tilfeldigheter flytter den fra utvalg til utvalg. Legg merke til C: den er ikke feil — den er bare ikke t. Den beskriver F, og det er nettopp dit denne forelesningen skal. Samme brøk, men en teller som tåler flere enn to grupper."}, {"id": "F5-A2", "f": 5, "dekk": [5], "slide": {"5": 6}, "type": "forelesning", "rolle": "Åpning", "sim": 22, "app": "PSY300_Sim_Anova.html#fane=hvorfor", "ch": 11, "fasit": "C", "q": "Tre grupper gir tre par. Hvorfor ikke bare kjøre tre t-tester?", "A": "Det er for tidkrevende.", "B": "t-testen tåler ikke tre grupper", "C": "Sjansen for falsk alarm blir for stor.", "D": "Man får ikke effektstørrelse.", "expl": "C. Hver test har 5 % sjanse for en falsk positiv. Tre uavhengige tester i en verden uten effekter gir 1 − 0.95³ ≈ 14 % sjanse for minst én — nesten tre ganger så høy feilrate som de 5 prosentene du trodde du hadde. Med fem grupper (ti par) er tallet 40 %. B er verdt å avlive eksplisitt: t-testen virker helt fint på hvert enkelt par. Problemet er ikke testen, det er antallet."}, {"id": "F5-A3", "f": 5, "dekk": [5], "slide": {"5": 16}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 22, "app": "PSY300_Sim_Anova.html#fane=null", "ch": 11, "fasit": "B", "q": "Hvis alle tre gruppene er helt like i populasjonen — hva blir F da, i gjennomsnitt?", "A": "0", "B": "rundt 1", "C": "rundt 0.05", "D": "negativ", "expl": "B. F er MS mellom delt på MS innen. Når H₀ er sann, estimerer teller og nevner den samme variansen, og forholdet mellom to anslag på det samme tallet ligger rundt 1. F ≈ 1 er nullhypotesens signatur. F kan ikke bli negativ (D), og 0.05 (C) er et signifikansnivå, ikke en testobservator."}, {"id": "F5-A4", "f": 5, "dekk": [5], "slide": {"5": 20}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 22, "app": "PSY300_Sim_Anova.html#fane=sim", "ch": 11, "fasit": "A", "q": "JASP skrev F(2, 72) = 8.58 for en enveis ANOVA med tre grupper og N = 75. Hva ville stått i parentesen med fem grupper og de samme 75 deltakerne?", "A": "F(4, 70) = 8.58", "B": "F(5, 70) = 8.58", "C": "F(4, 72) = 8.58", "D": "F(2, 70) = 8.58", "expl": "A. Første frihetsgrad er antall grupper minus 1, altså 4. Andre er N minus antall grupper, altså 75 − 5 = 70. C er den vanlige halvveisfeilen: telleren flyttes, men nevneren glemmes. Selve F-verdien er den samme i alle alternativene — poenget er at den ikke betyr noe før parentesen står der. F = 8.58 er et helt annet resultat ved F(4, 70) enn ved F(4, 12)."}, {"id": "F5-A5", "f": 5, "dekk": [5], "slide": {"5": 29}, "type": "forelesning", "rolle": "Sjekkpunkt", "sim": 22, "app": "PSY300_Sim_Anova.html#fane=eta", "ch": 11, "fasit": "A", "q": "Samme datasett, samme grupper, to utfallsvariabler. Depresjon etter behandling: η² = .193, p < .001. Negativ affekt: η² = .019, p = .50. Hvorfor er bare den ene signifikant?", "A": "Den ene effekten er st /* Rollen huskes i denne nettleseren. Åpne én PSY300-app med ?rolle=underviser
   én gang, så gjelder det alle appene på samme adresse til du åpner med
   ?rolle=student. Ingen innlogging, ingen personopplysninger. */
function PSY300_ROLLE(){
  try{
    const q=new URLSearchParams((location.search||'').replace(/^\?/,'')+'&'+(location.hash||'').replace(/^#/,'')).get("rolle");
    if(q==="underviser"||q==="student"){ localStorage.setItem("psy300_rolle",q); }
    return localStorage.getItem("psy300_rolle")||"student";
  }catch(e){ return "student"; }
}
const ROLLE = PSY300_ROLLE();

const $=id=>document.getElementById(id);
const P=new URLSearchParams((location.search||'').replace(/^\?/,'')+'&'+(location.hash||'').replace(/^#/,''));
const BOKSTAVER=["A","B","C","D"];
let AKTIV=null, VALGT=null, RUNDE=1;
const MERKE={Prediksjon:'m-pred', 'Åpner':'m-apn', 'Åpning':'m-apn', Sjekkpunkt:'m-sjekk',
             Avslutning:'m-avsl', Testvalg:'m-test', Reserve:'m-res'};
/* Prediksjoner holder tett: simuleringen skal avsløre svaret. Alle andre
   spørsmål tester noe som nettopp er undervist, og der gir retting med en
   gang mest læring. */
const viserFasit = it => it.type !== 'pred';
const kanStemmeIgjen = it => it.rolle === 'Sjekkpunkt' || it.rolle === 'Avslutning';

/* ---------- økt-id, så samme student ikke telles to ganger ---------- */
function sesjon(){
  try{
    let s=localStorage.getItem("psy300_pred_sid");
    if(!s){ s=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
            localStorage.setItem("psy300_pred_sid",s); }
    return s;
  }catch(e){ return "anon-"+Math.random().toString(36).slice(2,8); }
}
const SID=sesjon();
const alleredeSvart=id=>{ try{ return localStorage.getItem("psy300_pred_"+id); }catch(e){ return null; } };
const lagreSvar=(id,b)=>{ try{ localStorage.setItem("psy300_pred_"+id,b); }catch(e){} };

/* ---------- send stemmen ---------- */
function stem(id,bokstav,runde){
  const payload=JSON.stringify({kind:"pred", item_id:id, chosen:bokstav,
                                runde:runde||1, session_id:SID, rolle:ROLLE});
  fetch(BACKEND,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
                 body:payload, keepalive:true}).catch(function(){});
}

/* ---------- visning: ett spørsmål ---------- */
function visSporsmal(it){
  AKTIV=it;
  $("enkelt").classList.remove("hide");
  const bit=[];
  const d=dekkListe(it);
  if(d.length) bit.push("Forelesning "+d.join(" og "));
  if(it.sim)  bit.push("Sim "+it.sim);
  bit.push(it.id);
  $("kick").innerHTML=bit.join(" · ")+
    '<span class="merke '+(MERKE[it.rolle]||"m-res")+'">'+it.rolle+"</span>";
  $("sporsmal").textContent=it.q;
  const boks=$("valg"); boks.innerHTML="";
  BOKSTAVER.forEach(function(b){
    const knapp=document.createElement("button");
    knapp.className="opt"; knapp.dataset.b=b;
    knapp.innerHTML='<span class="ltr">'+b+'</span><span>'+it[b]+'</span>';
    knapp.addEventListener("click",function(){ velg(b); });
    boks.appendChild(knapp);
  });
  if(it.app){
    $("simlenke").innerHTML='Simuleringen som gir svaret: <a class="simlenke" href="'+BASE_SIM+it.app+'" target="_blank" rel="noopener">Sim '+it.sim+'</a>';
  }
  const gammelt=alleredeSvart(it.id);
  if(gammelt){ const d=gammelt.split("|"); RUNDE=+(d[1]||1); lasFast(d[0],true); }
  if(ROLLE==="underviser") $("laerer").classList.remove("hide");
  tegnNav();
}

/* ---------- navigasjon innenfor forelesningen ----------
   Et spørsmål kan ligge i flere dekk: PRED-F1-01 brukes både i forelesning 1 og,
   som repetisjon, i forelesning 2. «dekk» er derfor en liste og «slide» et
   oppslag fra dekknummer til slidenummer. Hvilket dekk studenten kom fra kan
   oppgis med &d= i lenka; ellers antar vi det siste (nyeste) dekket. */
function dekkListe(it){
  if(Array.isArray(it.dekk)) return it.dekk;
  return it.dekk ? [it.dekk] : [];
}
function slideNr(it, d){
  if(it.slide && typeof it.slide==="object") { const v=it.slide[String(d)]; return v==null?9999:v; }
  return it.slide==null?9999:it.slide;
}
function aktivtDekk(){
  const q=new URLSearchParams(location.search).get("d");
  const liste=dekkListe(AKTIV);
  if(q && liste.indexOf(+q)>=0) return +q;
  return liste.length ? liste[liste.length-1] : AKTIV.f;
}
function sokenListe(){
  /* «dekk» er fasit på hvor spørsmålet faktisk brukes. Et spørsmål med tom
     dekkliste ligger ikke i noe dekk ennå, og skal derfor heller ikke telles
     med i «i av N» — ellers lover navigasjonen flere spørsmål enn den viser. */
  const d=aktivtDekk();
  return ITEMS.filter(x=>dekkListe(x).indexOf(d)>=0)
              .sort((a,b)=>slideNr(a,d)-slideNr(b,d));
}
function tegnNav(){
  const l=sokenListe(), i=l.findIndex(x=>x.id===AKTIV.id);
  $("navtekst").textContent="Forelesning "+aktivtDekk()+" · "+(i+1)+" av "+l.length;
  $("forrige").disabled = i<=0;
  $("neste").disabled   = i>=l.length-1;
}
function bla(steg){
  const l=sokenListe(), i=l.findIndex(x=>x.id===AKTIV.id), n=i+steg;
  if(n<0||n>=l.length) return;
  location.search="?q="+l[n].id+"&d="+aktivtDekk();
}

function velg(b){
  if(VALGT) return;
  lagreSvar(AKTIV.id, b+"|"+RUNDE);
  stem(AKTIV.id, b, RUNDE);
  lasFast(b,false);
}

/* peer instruction: stem, snakk sammen, stem igjen. Begge rundene logges. */
function nyRunde(){
  RUNDE=2; VALGT=null;
  $("stemPaaNytt").classList.add("hide");
  $("fasitStudent").classList.add("hide");
  $("kvittering").classList.add("hide");
  document.querySelectorAll(".opt").forEach(o=>{
    o.disabled=false; o.classList.remove("valgt","riktig","galt");
  });
}

function lasFast(b,gjenopptatt){
  VALGT=b;
  document.querySelectorAll(".opt").forEach(function(o){
    o.disabled=true;
    if(o.dataset.b===b) o.classList.add("valgt");
  });
  const k=$("kvittering"); k.classList.remove("hide");
  const runde = RUNDE>1 ? " (runde "+RUNDE+")" : "";
  if(viserFasit(AKTIV)){
    const rett = b===AKTIV.fasit;
    document.querySelectorAll(".opt").forEach(o=>{
      if(o.dataset.b===AKTIV.fasit) o.classList.add("riktig");
      else if(o.dataset.b===b) o.classList.add("galt");
    });
    k.innerHTML = (rett ? "<b>Riktig!</b>" : "<b>Ikke riktig.</b> Fasit er "+AKTIV.fasit+".")+runde;
    const f=$("fasitStudent"); f.classList.remove("hide");
    f.innerHTML='<div class="expl">'+AKTIV.expl+"</div>";
  } else {
    k.innerHTML = (gjenopptatt
      ? "<b>Du har allerede svart "+b+" på denne.</b>"
      : "<b>Svaret ditt er registrert.</b>")+runde+" Fasit avsløres av simuleringen, ikke her.";
  }
  if(kanStemmeIgjen(AKTIV) && RUNDE===1 && !gjenopptatt)
    $("stemPaaNytt").classList.remove("hide");
}

/* ---------- underviser: hent og tegn klassens svar ---------- */
function hentResultat(){
  $("antall").textContent=" henter …";
  fetch(BACKEND+"?action=pred&id="+encodeURIComponent(AKTIV.id))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.ok){ $("antall").textContent=" fant ingen svar ennå"; return; }
      SISTE=d;
      tegn(d.fordeling||{A:0,B:0,C:0,D:0}, d.n||0, d.fordeling2, d.n2||0);
      $("antall").textContent=" "+(d.n||0)+" svar"+((d.n2||0)?" · runde 2: "+d.n2:"");
    })
    .catch(function(){ $("antall").textContent=" kunne ikke hente (sjekk nett)"; });
}

let SISTE=null;
function tegn(f,n,f2,n2){
  const cv=$("graf"); cv.classList.remove("hide");
  const r=window.devicePixelRatio||1, w=cv.clientWidth, h=+(cv.dataset.h||(cv.dataset.h=cv.getAttribute("height")));
  cv.width=w*r; cv.height=h*r; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(r,0,0,r,0,0);
  c.clearRect(0,0,w,h);
  const x0=40,y0=h-34,pw=w-x0-14,ph=y0-24;
  const toRunder = !!(n2 && n2>0);
  const maks=Math.max(1,f.A,f.B,f.C,f.D, toRunder?Math.max(f2.A,f2.B,f2.C,f2.D):0);
  const gap=pw/4, bw=gap*(toRunder?0.30:0.62);
  c.font="bold 15px sans-serif";
  BOKSTAVER.forEach(function(b,i){
    const rett = FASIT_VIST && b===AKTIV.fasit;
    const midt = x0+gap*i+gap/2;
    const v=f[b]||0, bh=v/maks*ph;
    const bx = toRunder ? midt-bw-3 : midt-bw/2;
    c.fillStyle = rett ? "#7fbf88" : "#bcd0e8";
    c.fillRect(bx,y0-bh,bw,bh);
    c.fillStyle="#62708a"; c.textAlign="center";
    c.fillText((n?Math.round(v/n*100):0)+" %", bx+bw/2, y0-bh-7);
    if(toRunder){
      const v2=f2[b]||0, bh2=v2/maks*ph;
      c.fillStyle = rett ? "#2E7D32" : "#4a7fc1";
      c.fillRect(midt+3,y0-bh2,bw,bh2);
      c.fillStyle="#1a2233";
      c.fillText((n2?Math.round(v2/n2*100):0)+" %", midt+3+bw/2, y0-bh2-7);
    }
    c.fillStyle="#1a2233"; c.font="bold 17px sans-serif";
    c.fillText(b,midt,y0+21); c.font="bold 15px sans-serif";
  });
  if(toRunder){
    c.textAlign="left"; c.font="bold 14px sans-serif";
    c.fillStyle="#bcd0e8"; c.fillRect(x0,8,13,13);
    c.fillStyle="#62708a"; c.fillText("runde 1",x0+18,19);
    c.fillStyle="#4a7fc1"; c.fillRect(x0+95,8,13,13);
    c.fillStyle="#1a2233"; c.fillText("etter diskusjon",x0+113,19);
  }
  c.strokeStyle="#b9c3d6"; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(x0-6,y0); c.lineTo(x0+pw,y0); c.stroke();
}

let FASIT_VIST=false;
function visFasit(){
  FASIT_VIST=true;
  document.querySelectorAll(".opt").forEach(function(o){
    if(o.dataset.b===AKTIV.fasit) o.classList.add("riktig");
    else if(o.dataset.b===VALGT) o.classList.add("galt");
  });
  const fb=$("fasitboks"); fb.classList.remove("hide");
  fb.innerHTML='<div class="expl"><b>Fasit '+AKTIV.fasit+':</b> '+AKTIV.expl+'</div>';
  if(!$("graf").classList.contains("hide")) hentResultat();
}

/* ---------- visning: oversikt ---------- */
function visOversikt(){
  $("oversikt").classList.remove("hide");
  /* Rekkefølgen følger slidene i forelesningsdekkene, ikke ID-ene: en
     prediksjon merket F2 kan godt ligge sist i dekket til forelesning 1. */
  const l=$("liste");
  const dekk=[]; ITEMS.forEach(it=>dekkListe(it).forEach(d=>{ if(dekk.indexOf(d)<0) dekk.push(d); }));
  dekk.sort((a,b)=>a-b);
  function rad(it, teller, d){
    const a=document.createElement("a");
    a.href="?q="+it.id+(d?"&d="+d:"");
    const hva = it.sim ? "Sim "+it.sim : it.rolle;
    const flere = dekkListe(it).length>1
      ? ' <span class="muted">· også i forelesning '+dekkListe(it).filter(x=>x!==d).join(" og ")+"</span>" : "";
    a.innerHTML="<b>"+(teller?teller+". ":"")+hva+'</b> <span class="merke '+
                (MERKE[it.rolle]||"m-res")+'">'+it.rolle+"</span>"+flere+"<br>"+it.q+
                ' <span class="muted">('+it.id+")</span>";
    l.appendChild(a);
  }
  dekk.forEach(function(d){
    const h=document.createElement("div"); h.className="flab";
    h.textContent="Forelesning "+d; l.appendChild(h);
    ITEMS.filter(it=>dekkListe(it).indexOf(d)>=0)
         .sort((a,b)=>slideNr(a,d)-slideNr(b,d))
         .forEach((it,i)=>rad(it,i+1,d));
  });
  const uten=ITEMS.filter(it=>dekkListe(it).length===0);
  if(uten.length){
    const h=document.createElement("div"); h.className="flab";
    h.textContent="Ikke lagt inn i et dekk ennå"; l.appendChild(h);
    uten.forEach(it=>rad(it,0,0));
  }
}

/* ---------- oppstart ---------- */
(function(){
  const id=(P.get("q")||"").toUpperCase().trim();
  const it=ITEMS.filter(function(x){ return x.id===id; })[0];
  if(it) visSporsmal(it); else visOversikt();
  const kn=$("visResultat"); if(kn) kn.addEventListener("click",hentResultat);
  const kb=$("stemPaaNytt"); if(kb) kb.addEventListener("click",nyRunde);
  const kf1=$("forrige"); if(kf1) kf1.addEventListener("click",()=>bla(-1));
  const kn1=$("neste");   if(kn1) kn1.addEventListener("click",()=>bla(1));
  const kf=$("visFasit");    if(kf) kf.addEventListener("click",visFasit);
  const ko=$("oppdater");    if(ko) ko.addEventListener("click",hentResultat);
  if(P.get("pres")==="1") document.body.classList.add("pres");
  window.addEventListener("resize",function(){
    if(AKTIV && !$("graf").classList.contains("hide")) hentResultat();
  });
})();

/* ---------- bruksstatistikk (anonymt, samme mønster som simuleringsappene) ---------- */
(function(){
  var APP="Prediksjoner", NAVN="Prediksjoner";
  var PSY300_USAGE_URL = BACKEND;
  var sid=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
  var aktiv=0, sist=Date.now(), interaksjoner=0, sendt=false;
  function tikk(){ if(!document.hidden){ var na=Date.now();
    aktiv+=Math.min(30000, na-sist); } sist=Date.now(); }
  document.addEventListener("click",function(){ interaksjoner++; });
  setInterval(tikk, 15000);
  function send(type){
    if(type==="lukket"){ if(sendt) return; sendt=true; tikk(); }
    var payload=JSON.stringify({kind:"usage", app:APP, navn:NAVN, event:type,
      session_id:sid, sekunder:Math.round(aktiv/1000), interaksjoner:interaksjoner,
      innebygd:(window.top!==window.self)?1:0, rolle:PSY300_ROLLE()});
    try{
      if(type==="lukket" && navigator.sendBeacon){
        navigator.sendBeacon(PSY300_USAGE_URL, new Blob([payload],{type:"text/plain;charset=utf-8"}));
      } else {
        fetch(PSY300_USAGE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:payload, keepalive:true}).catch(function(){});
      }
    }catch(e){}
  }
  send("apnet");
  window.addEventListener("pagehide", function(){ send("lukket"); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) send("lukket"); });
})();
</script>
</body></html>
